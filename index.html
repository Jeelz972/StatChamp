<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasketCoach Pro - Analytics & Live Stats + Gemini AI</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Version 18) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Dependance requise pour Recharts UMD -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (Version Fixe Stable pour UMD) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'court-wood': '#f0e6d2',
                        'court-orange': '#e65100',
                        'coach-dark': '#1e293b',
                        'coach-accent': '#f97316',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { color: #f97316; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- FIX RECHARTS & DESTRUCTURING ---
        // On récupère tout ce qui est nécessaire depuis window.Recharts
        const {
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
            LineChart, Line, PieChart, Pie, Cell, Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis
        } = window.Recharts || {};

        // Fix pour supprimer les warnings "defaultProps" dans la console avec React 18.3+
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === "string" && /defaultProps/.test(args[0])) {
                return;
            }
            originalConsoleError(...args);
        };

        // --- ICONS ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d={path} />
            </svg>
        );
        const Icons = {
            Activity: "M22 12h-4l-3 9L9 3l-3 9H2",
            Clipboard: "M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2 M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z",
            Settings: "M12.22 2h-.44a2 2 0 0 1-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
            Play: "M5 3l14 9-14 9V3z",
            Trash: "M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
            Save: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8V3",
            Chart: "M18 20V10 M12 20V4 M6 20v-6",
            Zap: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
            Swords: "M14.5 17.5L3 6V3h3l11.5 11.5 M13 19l6-6 M16 16l4 4 M19 21l2-2",
            Undo: "M3 7v6h6 M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13",
            Sparkles: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
            MessageSquare: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
            Key: "M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
            Plus: "M12 5v14M5 12h14",
            Robot: "M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z",
            Eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8-11-8-11-8z M12 5c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7z M12 15c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z",
            List: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
            Check: "M20 6L9 17l-5-5"
        };

        // --- UTILS ---
        const generateId = () => Math.random().toString(36).substr(2, 9);

        const callGemini = async (prompt, apiKey) => {
            if (!apiKey) throw new Error("Clé API manquante");
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            if (!response.ok) throw new Error("Erreur API Gemini");
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        };

        const defaultPlayers = [
            { id: 1, name: "Meneur A", number: 4, pos: "PG", style: "Playmaker", height: 185 },
            { id: 2, name: "Arrière B", number: 5, pos: "SG", style: "Sharpshooter", height: 192 },
            { id: 3, name: "Ailier C", number: 8, pos: "SF", style: "Two-Way", height: 201 },
            { id: 4, name: "Intérieur D", number: 12, pos: "PF", style: "Rim Protector", height: 206 },
            { id: 5, name: "Pivot E", number: 15, pos: "C", style: "Paint Beast", height: 213 },
            { id: 6, name: "Remplaçant F", number: 6, pos: "PG", style: "Slasher", height: 188 },
            { id: 7, name: "Remplaçant G", number: 7, pos: "SF", style: "3&D", height: 198 },
            { id: 8, name: "Remplaçant H", number: 9, pos: "PF", style: "Stretch Four", height: 203 },
            { id: 9, name: "Joueur I", number: 10, pos: "SG", style: "Scorer", height: 190 },
            { id: 10, name: "Joueur J", number: 11, pos: "SF", style: "Defense", height: 200 },
            { id: 11, name: "Joueur K", number: 13, pos: "PF", style: "Rebounder", height: 205 },
            { id: 12, name: "Joueur L", number: 14, pos: "C", style: "Big Man", height: 210 },
            { id: 13, name: "Joueur M", number: 16, pos: "PG", style: "Rookie", height: 182 },
        ];

        const calculateAdvancedStats = (stats, minOverride = null) => {
            const min = minOverride !== null ? minOverride : (stats.minutes || 0);
            const eff = (stats.pts + (stats.oreb + stats.dreb) + stats.ast + stats.stl + stats.blk) - 
                        ((stats.fga - stats.fgm) + (stats.fta - stats.ftm) + stats.tov);
            const poss = stats.fga + (0.44 * stats.fta) + stats.tov;
            const ortg = poss > 0 ? (stats.pts / poss) * 100 : 0;
            const drtg = poss > 0 ? (stats.pointsAllowed / poss) * 100 : 100;
            return {
                eff: eff,
                effPerMin: min > 0 ? (eff / min) : 0,
                ortg: parseFloat(ortg.toFixed(1)),
                drtg: parseFloat(drtg.toFixed(1)),
                netRtg: parseFloat((ortg - drtg).toFixed(1)),
                poss: parseFloat(poss.toFixed(1))
            };
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = "primary", className = "", size = "md", disabled=false }) => {
            const base = "font-semibold rounded transition-all duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-coach-accent hover:bg-orange-600 text-white shadow-md",
                secondary: "bg-slate-700 hover:bg-slate-600 text-slate-200",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                success: "bg-green-600 hover:bg-green-700 text-white",
                ghost: "bg-transparent hover:bg-slate-700 text-slate-400",
                magic: "bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white shadow-lg border border-purple-400/30"
            };
            const sizes = { sm: "px-2 py-1 text-xs", md: "px-4 py-2 text-sm", lg: "px-6 py-3 text-lg" };
            return (
                <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed':''}`}>
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-800 rounded-xl border border-slate-600 w-full max-w-lg shadow-2xl transform transition-all scale-100 max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center p-4 border-b border-slate-700 shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl">&times;</button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- CORE LOGIC: REBUILD STATS FROM ACTIONS ---
        const recalculateStats = (actions, players) => {
            const pStats = {};
            // Init safely
            players.forEach(p => {
                pStats[p.id] = { pts: 0, reb: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fga: 0, fgm: 0, fta: 0, ftm: 0, pf: 0, pointsAllowed: 0, minutes: 0 };
            });
            const oppStats = { pts: 0, reb: 0, ast: 0, tov: 0, fouls: 0, fga: 0, fgm: 0, fta: 0, ftm: 0 };
            let home = 0, away = 0;

            actions.forEach(act => {
                const { type, playerId, consequence } = act;
                
                // Logique Adversaire
                if (playerId === 'OPP') {
                    if (type === "FGM1") { oppStats.pts += 1; oppStats.ftm += 1; oppStats.fta += 1; away += 1; }
                    if (type === "FGA1") { oppStats.fta += 1; }
                    if (type === "FGM2") { oppStats.pts += 2; oppStats.fgm += 1; oppStats.fga += 1; away += 2; }
                    if (type === "FGA2") { oppStats.fga += 1; }
                    if (type === "FGM3") { oppStats.pts += 3; oppStats.fgm += 1; oppStats.fga += 1; away += 3; }
                    if (type === "FGA3") { oppStats.fga += 1; }
                    if (type === "DREB" || type === "OREB") { oppStats.reb += 1; }
                    if (type === "AST") { oppStats.ast += 1; }
                    if (type === "TOV") { oppStats.tov += 1; }
                    if (type === "PF") { oppStats.fouls += 1; }
                    
                    // Conséquences adversaires (Points pour NOUS)
                    if (consequence === "score_2") { home += 2; }
                    if (consequence === "score_3") { home += 3; }
                } 
                // Logique Joueur
                else if (pStats[playerId]) {
                    const ps = pStats[playerId];
                    if (type === "FGM1") { ps.pts += 1; ps.ftm += 1; ps.fta += 1; home += 1; }
                    if (type === "FGA1") { ps.fta += 1; }
                    if (type === "FGM2") { ps.pts += 2; ps.fgm += 1; ps.fga += 1; home += 2; }
                    if (type === "FGA2") { ps.fga += 1; }
                    if (type === "FGM3") { ps.pts += 3; ps.fgm += 1; ps.fga += 1; home += 3; }
                    if (type === "FGA3") { ps.fga += 1; }
                    if (type === "OREB") { ps.reb += 1; ps.oreb += 1; }
                    if (type === "DREB") { ps.reb += 1; ps.dreb += 1; }
                    if (type === "AST") { ps.ast += 1; }
                    if (type === "STL") { ps.stl += 1; }
                    if (type === "BLK") { ps.blk += 1; }
                    if (type === "TOV") { ps.tov += 1; }
                    if (type === "PF") { ps.pf += 1; }

                    // Conséquences Joueurs (Points pour EUX)
                    if (consequence === "score_2") { ps.pointsAllowed += 2; away += 2; }
                    if (consequence === "score_3") { ps.pointsAllowed += 3; away += 3; }
                }
            });

            return { playerStats: pStats, opponentStats: oppStats, homeScore: home, awayScore: away };
        };

        const LiveTracker = ({ players, onSaveGame }) => {
            const [gameState, setGameState] = useState({
                quarter: 1, opponent: "Adversaire", location: "Domicile",
                actions: []
            });
            // Derived stats for UI
            const [derived, setDerived] = useState(recalculateStats([], players));
            
            // Modals
            const [modal, setModal] = useState({ type: null, data: null });
            const [showStats, setShowStats] = useState(false);
            const [showLog, setShowLog] = useState(false);
            const [showMinutes, setShowMinutes] = useState(false);
            const [minutesInput, setMinutesInput] = useState({});

            useEffect(() => {
                setDerived(recalculateStats(gameState.actions, players));
            }, [gameState.actions, players]);

            // Add action
            const registerAction = (actionType, player, extraData = {}) => {
                const newAction = {
                    id: generateId(),
                    type: actionType,
                    playerId: player === 'opponent' ? 'OPP' : player.id,
                    playerName: player === 'opponent' ? 'Adversaire' : player.name,
                    q: gameState.quarter,
                    consequence: extraData.consequence,
                    timestamp: new Date().toLocaleTimeString()
                };
                setGameState(prev => ({ ...prev, actions: [...prev.actions, newAction] }));
                setModal({ type: null, data: null });
            };

            // Remove action (Edit capability)
            const removeAction = (actionId) => {
                if(confirm("Supprimer cette action ?")) {
                    setGameState(prev => ({ ...prev, actions: prev.actions.filter(a => a.id !== actionId) }));
                }
            };

            const handleFinishGame = () => {
                // Pre-fill minutes
                const mins = {};
                players.forEach(p => mins[p.id] = 0);
                setMinutesInput(mins);
                setShowMinutes(true);
            };

            const finalizeGame = () => {
                // Merge minutes into final stats
                const finalStats = { ...derived.playerStats };
                Object.keys(minutesInput).forEach(pid => {
                    if(finalStats[pid]) finalStats[pid].minutes = parseInt(minutesInput[pid]) || 0;
                });

                onSaveGame({
                    ...gameState,
                    homeScore: derived.homeScore,
                    awayScore: derived.awayScore,
                    playerStats: finalStats,
                    opponentStats: derived.opponentStats
                });
            };

            // Consequence Buttons Helper
            const ConsequenceButtons = ({ onSelect }) => (
                <div className="flex flex-col gap-2">
                    <Button onClick={() => onSelect("score_2")} className="bg-red-600/80">Adversaire +2 Pts</Button>
                    <Button onClick={() => onSelect("score_3")} className="bg-red-600">Adversaire +3 Pts</Button>
                    <Button onClick={() => onSelect("foul")} className="bg-yellow-600">Faute Provoquée</Button>
                    <Button onClick={() => onSelect("foul_ft")} className="bg-yellow-700">Faute + Lancers</Button>
                    <Button onClick={() => onSelect("none")} className="bg-slate-600">Rien (Touche...)</Button>
                </div>
            );
            
            // Positive Consequences (For Us)
            const PositiveConsequenceButtons = ({ onSelect }) => (
                <div className="flex flex-col gap-2">
                    <Button onClick={() => onSelect("score_2")} className="bg-green-600/80">Nous Marquons +2</Button>
                    <Button onClick={() => onSelect("score_3")} className="bg-green-600">Nous Marquons +3</Button>
                    <Button onClick={() => onSelect("foul")} className="bg-yellow-600">Faute sur Nous</Button>
                    <Button onClick={() => onSelect("none")} className="bg-slate-600">Rien</Button>
                </div>
            );

            return (
                <div className="flex flex-col h-full gap-4 relative">
                    {/* Header Scoreboard */}
                    <Card className="bg-slate-900 p-4 flex justify-between items-center sticky top-0 z-10 border-b-4 border-coach-accent">
                        <div className="text-center">
                             <div className="text-4xl font-bold text-white">{derived.homeScore}</div>
                        </div>
                        <div className="flex flex-col items-center">
                            <div className="text-xl font-bold text-orange-500">Q{gameState.quarter}</div>
                            <div className="flex gap-2 mt-1">
                                <button onClick={() => setGameState(p=>({...p, quarter: Math.max(1, p.quarter-1)}))} className="text-xs text-slate-500 hover:text-white">-</button>
                                <button onClick={() => setGameState(p=>({...p, quarter: p.quarter+1}))} className="text-xs text-slate-500 hover:text-white">+</button>
                            </div>
                        </div>
                        <div className="text-center">
                            <div className="text-4xl font-bold text-red-500">{derived.awayScore}</div>
                        </div>
                    </Card>

                    {/* Controls Bar */}
                    <div className="flex gap-2 justify-center">
                        <Button size="sm" variant="secondary" onClick={() => setShowStats(true)}><Icon path={Icons.Eye} /> Stats</Button>
                        <Button size="sm" variant="secondary" onClick={() => setShowLog(true)}><Icon path={Icons.List} /> Journal ({gameState.actions.length})</Button>
                    </div>

                    {/* Players Grid */}
                    <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-4 gap-3 pb-20">
                        {players.map(player => {
                            // SAFEGUARD: Ensure stats exist for player
                            const pStats = derived.playerStats[player.id] || { pts: 0, pf: 0 };
                            return (
                                <div key={player.id} onClick={() => setModal({ type: "ACTION_MENU", data: player })} className="bg-slate-800 p-3 rounded-xl border border-slate-700 shadow-md hover:border-coach-accent cursor-pointer">
                                    <div className="flex justify-between">
                                        <span className="font-bold text-white truncate">{player.name}</span>
                                        <span className="text-xs text-slate-400">#{player.number}</span>
                                    </div>
                                    <div className="text-xs mt-1 text-slate-400 flex gap-2">
                                        <span>P: <b className="text-white">{pStats.pts}</b></span>
                                        <span>F: <b className="text-red-300">{pStats.pf}</b></span>
                                    </div>
                                </div>
                            );
                        })}
                        {/* Opponent Card */}
                        <div onClick={() => setModal({ type: "ACTION_MENU", data: "opponent" })} className="bg-red-900/40 p-3 rounded-xl border border-red-700 shadow-md hover:border-red-500 cursor-pointer flex flex-col items-center justify-center text-center">
                            <span className="font-bold text-red-200">ADVERSAIRE</span>
                            <div className="text-xs mt-1 text-red-300">Fautes: {derived.opponentStats.fouls}</div>
                        </div>
                    </div>

                    {/* Footer */}
                    <div className="fixed bottom-0 left-0 right-0 bg-slate-900 p-4 border-t border-slate-800 flex justify-end z-20">
                        <Button variant="success" onClick={handleFinishGame}><Icon path={Icons.Check} /> Finir Match</Button>
                    </div>

                    {/* --- MODALS --- */}

                    {/* 1. Main Action Menu (Player & Opponent) */}
                    <Modal isOpen={modal.type === "ACTION_MENU"} onClose={() => setModal({type:null})} title={modal.data === 'opponent' ? "Actions Adversaire" : modal.data?.name}>
                        <div className="grid grid-cols-3 gap-3">
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM2", modal.data)}>+2 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM3", modal.data)}>+3 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM1", modal.data)}>+1 LF</Button>
                            
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA2", modal.data)}>Miss 2</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA3", modal.data)}>Miss 3</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA1", modal.data)}>Miss LF</Button>
                            
                            <div className="col-span-3 h-px bg-slate-600 my-1"></div>
                            
                            <Button className="bg-blue-600" onClick={() => registerAction("DREB", modal.data)}>Reb D</Button>
                            <Button className="bg-blue-500" onClick={() => registerAction("OREB", modal.data)}>Reb O</Button>
                            <Button className="bg-purple-600" onClick={() => registerAction("AST", modal.data)}>Passe</Button>
                            
                            {/* Interception avec conséquence */}
                            <Button className="bg-yellow-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_STL", data: modal.data}) : setModal({type: "CONSEQ_OPP_STL", data: modal.data})}>Int</Button>
                            
                            {/* Balle Perdue avec conséquence */}
                            <Button className="bg-orange-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_TOV", data: modal.data}) : setModal({type: "CONSEQ_OPP_TOV", data: modal.data})}>Balle P.</Button>
                            
                            <Button className="bg-slate-600" onClick={() => registerAction("BLK", modal.data)}>Contre</Button>
                            <Button variant="danger" className="col-span-3 mt-2" onClick={() => registerAction("PF", modal.data)}>Faute Perso</Button>
                        </div>
                    </Modal>

                    {/* 2. Consequences Modals */}
                    
                    {/* TOV JOUEUR (Négatif pour nous) */}
                    <Modal isOpen={modal.type === "CONSEQ_TOV"} onClose={() => setModal({type:null})} title="Conséquence Balle Perdue ?">
                        <ConsequenceButtons onSelect={(c) => registerAction("TOV", modal.data, { consequence: c })} />
                    </Modal>
                    
                    {/* STL JOUEUR (Positif pour nous) */}
                    <Modal isOpen={modal.type === "CONSEQ_STL"} onClose={() => setModal({type:null})} title="Suite à l'Interception ?">
                         <PositiveConsequenceButtons onSelect={(c) => registerAction("STL", modal.data, { consequence: c })} />
                    </Modal>

                    {/* TOV ADVERSAIRE (Positif pour nous) */}
                    <Modal isOpen={modal.type === "CONSEQ_OPP_TOV"} onClose={() => setModal({type:null})} title="Conséquence Perte Adv. ?">
                        <PositiveConsequenceButtons onSelect={(c) => registerAction("TOV", "opponent", { consequence: c })} />
                    </Modal>

                    {/* STL ADVERSAIRE (Négatif pour nous) */}
                    <Modal isOpen={modal.type === "CONSEQ_OPP_STL"} onClose={() => setModal({type:null})} title="Suite Interception Adv. ?">
                         <ConsequenceButtons onSelect={(c) => registerAction("STL", "opponent", { consequence: c })} />
                    </Modal>


                    {/* 3. Live Stats Modal */}
                    <Modal isOpen={showStats} onClose={() => setShowStats(false)} title="Statistiques en Direct">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-300">
                                <thead className="bg-slate-700 text-white uppercase">
                                    <tr>
                                        <th className="p-2">J</th>
                                        <th className="p-2">Pts</th>
                                        <th className="p-2">Reb</th>
                                        <th className="p-2">Ast</th>
                                        <th className="p-2">Fte</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {players.map(p => {
                                        const s = derived.playerStats[p.id] || { pts: 0, reb: 0, ast: 0, pf: 0 };
                                        return (
                                            <tr key={p.id}>
                                                <td className="p-2 font-bold">{p.name}</td>
                                                <td className="p-2">{s.pts}</td>
                                                <td className="p-2">{s.reb}</td>
                                                <td className="p-2">{s.ast}</td>
                                                <td className="p-2 text-red-400">{s.pf}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </Modal>

                    {/* 4. Log / History Modal */}
                    <Modal isOpen={showLog} onClose={() => setShowLog(false)} title="Journal du Match">
                        <div className="space-y-2">
                            {gameState.actions.length === 0 && <div className="text-slate-500 text-center">Aucune action.</div>}
                            {gameState.actions.slice().reverse().map(act => (
                                <div key={act.id} className="bg-slate-800 p-2 rounded flex justify-between items-center text-sm border border-slate-700">
                                    <div>
                                        <span className="text-orange-400 font-bold mr-2">Q{act.q}</span>
                                        <span className="text-white font-bold">{act.playerName}</span>
                                        <span className="text-slate-400 mx-1">-</span>
                                        <span className="text-slate-300">{act.type}</span>
                                        {act.consequence && act.consequence !== 'none' && <span className="text-xs text-red-400 ml-2">({act.consequence})</span>}
                                    </div>
                                    <button onClick={() => removeAction(act.id)} className="text-red-500 hover:text-red-300 px-2 py-1 bg-red-900/30 rounded">X</button>
                                </div>
                            ))}
                        </div>
                    </Modal>

                    {/* 5. Minutes / End Game Modal */}
                    <Modal isOpen={showMinutes} onClose={() => setShowMinutes(false)} title="Temps de Jeu">
                        <div className="space-y-4">
                            <p className="text-sm text-slate-400">Veuillez estimer les minutes jouées pour finaliser les stats.</p>
                            <div className="grid grid-cols-2 gap-2 max-h-60 overflow-y-auto">
                                {players.map(p => (
                                    <div key={p.id} className="flex justify-between items-center bg-slate-900 p-2 rounded border border-slate-700">
                                        <span className="text-xs text-white">{p.name}</span>
                                        <input 
                                            type="number" 
                                            className="w-16 bg-slate-800 border border-slate-600 rounded px-1 text-white text-right"
                                            value={minutesInput[p.id]}
                                            onChange={(e) => setMinutesInput({...minutesInput, [p.id]: e.target.value})}
                                            placeholder="Min"
                                        />
                                    </div>
                                ))}
                            </div>
                            <Button variant="success" className="w-full mt-4" onClick={finalizeGame}>Confirmer et Sauvegarder</Button>
                        </div>
                    </Modal>
                </div>
            );
        };

        const CoachAssistant = ({ aggregatedStats, apiKey }) => {
            const [messages, setMessages] = useState([
                { role: 'system', content: "Bonjour Coach ! Je suis votre assistant IA. J'ai analysé les statistiques de l'équipe." }
            ]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => {
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim()) return;
                if (!apiKey) {
                    setMessages(prev => [...prev, { role: 'system', content: "⚠️ Configurez votre clé API Gemini." }]);
                    return;
                }
                const userMsg = input;
                setMessages(prev => [...prev, { role: 'user', content: userMsg }]);
                setInput("");
                setLoading(true);
                try {
                    const context = `Tu es un assistant expert basket. Stats équipe: ${JSON.stringify(aggregatedStats)}. Question: ${userMsg}`;
                    const reply = await callGemini(context, apiKey);
                    setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'system', content: "❌ Erreur API." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-[600px] bg-slate-900 rounded-xl border border-slate-700 overflow-hidden">
                    <div className="p-4 bg-slate-800 border-b border-slate-700 flex items-center gap-2">
                        <Icon path={Icons.Sparkles} className="text-purple-400" />
                        <h3 className="font-bold text-white">Assistant Coach Virtuel</h3>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4" ref={scrollRef}>
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`max-w-[80%] rounded-lg p-3 text-sm ${m.role === 'user' ? 'bg-coach-accent text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'}`}>
                                    {m.role === 'assistant' ? <div className="markdown-body" dangerouslySetInnerHTML={{ __html: marked.parse(m.content) }} /> : m.content}
                                </div>
                            </div>
                        ))}
                        {loading && <div className="text-slate-500 p-2 text-sm">IA réfléchit...</div>}
                    </div>
                    <div className="p-4 bg-slate-800 border-t border-slate-700 flex gap-2">
                        <input className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white outline-none" placeholder="Question..." value={input} onChange={(e) => setInput(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && handleSend()} />
                        <button onClick={handleSend} disabled={loading} className="bg-purple-600 text-white p-2 rounded-lg"><Icon path={Icons.MessageSquare} /></button>
                    </div>
                </div>
            );
        };

        const CoachOS = ({ players, games, apiKey }) => {
            const [activeTab, setActiveTab] = useState("dashboard");
            const [simLineup, setSimLineup] = useState([null,null,null,null,null]);

            const aggregatedStats = useMemo(() => {
                const stats = {};
                players.forEach(p => stats[p.id] = { ...p, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, tov: 0, fga: 0, fgm: 0, fta: 0, ftm: 0, pointsAllowed: 0, stl: 0, blk: 0, oreb: 0, dreb: 0, pf: 0 });
                games.forEach(g => {
                    Object.entries(g.playerStats).forEach(([pid, ps]) => {
                        if (stats[pid]) {
                            stats[pid].gp++; stats[pid].min += (ps.minutes||0); stats[pid].pts += ps.pts;
                            stats[pid].reb += ps.reb; stats[pid].ast += ps.ast; stats[pid].tov += ps.tov;
                            stats[pid].fga += ps.fga; stats[pid].fgm += ps.fgm; stats[pid].fta += ps.fta; stats[pid].ftm += ps.ftm;
                            stats[pid].pointsAllowed += (ps.pointsAllowed||0); stats[pid].stl += ps.stl; stats[pid].blk += ps.blk; stats[pid].oreb += ps.oreb; stats[pid].dreb += ps.dreb; stats[pid].pf += ps.pf;
                        }
                    });
                });
                return Object.values(stats).map(s => ({ ...s, ...calculateAdvancedStats(s, s.min) }));
            }, [games, players]);

            const renderAIRecommendation = () => {
                const weightedPlayers = aggregatedStats.map(p => {
                    const positives = p.pts + p.reb + p.ast + p.stl + p.blk;
                    const negatives = p.tov + p.pf + (p.fga - p.fgm) + (p.fta - p.ftm);
                    const totalTime = p.min;
                    
                    let score = 0;
                    let logic = "";
                    
                    if (totalTime < 15) {
                        score = (positives * 0.5) - (negatives * 3.0);
                        logic = "Faible échantillon (Sévère)";
                    } else {
                        score = (positives * 1.2) - (negatives * 0.8);
                        logic = "Haut temps de jeu (Confiant)";
                    }
                    score += (p.netRtg * 0.5);

                    return { ...p, weightedScore: score, logic };
                }).sort((a, b) => b.weightedScore - a.weightedScore);

                const top5 = weightedPlayers.slice(0, 5);

                return (
                    <div className="space-y-6 animate-fade-in">
                        <Card className="p-6 border-l-4 border-indigo-500 bg-slate-900">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2 mb-4">
                                <Icon path={Icons.Robot} /> 5 Majeur IA (Algorithme Pondéré)
                            </h3>
                            <div className="grid gap-3">
                                {top5.map((p, idx) => (
                                    <div key={p.id} className="flex items-center justify-between bg-slate-800 p-3 rounded-lg border border-slate-700">
                                        <div className="flex items-center gap-3">
                                            <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold">{idx + 1}</div>
                                            <div>
                                                <div className="font-bold text-white">{p.name}</div>
                                                <div className="text-xs text-indigo-300">{p.logic}</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-lg font-bold text-white">{p.weightedScore.toFixed(1)}</div>
                                            <div className="text-[10px] uppercase text-slate-500">Score IA</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                    </div>
                );
            };

            const renderDashboard = () => (
                <div className="space-y-6 animate-fade-in">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <Card className="p-4 border-l-4 border-orange-500">
                            <h4 className="text-xs uppercase text-slate-400">Top Scorer</h4>
                            <div className="text-2xl font-bold text-white">{[...aggregatedStats].sort((a,b)=>b.pts-a.pts)[0]?.name || "-"}</div>
                        </Card>
                        <Card className="p-4 border-l-4 border-blue-500">
                            <h4 className="text-xs uppercase text-slate-400">MVP (EFF)</h4>
                            <div className="text-2xl font-bold text-white">{[...aggregatedStats].sort((a,b)=>b.eff-a.eff)[0]?.name || "-"}</div>
                        </Card>
                        <Card className="p-4 border-l-4 border-green-500">
                            <h4 className="text-xs uppercase text-slate-400">Net Rtg King</h4>
                            <div className="text-2xl font-bold text-white">{[...aggregatedStats].sort((a,b)=>b.netRtg-a.netRtg)[0]?.name || "-"}</div>
                        </Card>
                    </div>
                    <Card className="p-4 h-80">
                        <ResponsiveContainer width="100%" height="100%">
                            <BarChart data={aggregatedStats}>
                                <XAxis dataKey="name" stroke="#94a3b8" />
                                <Tooltip contentStyle={{backgroundColor:'#1e293b', border:'none'}} />
                                <Bar dataKey="eff" fill="#f97316" radius={[4,4,0,0]} />
                            </BarChart>
                        </ResponsiveContainer>
                    </Card>
                </div>
            );

            const renderSim = () => {
                const active = simLineup.map(id => aggregatedStats.find(p => p.id == id)).filter(Boolean);
                const stats = active.length ? {
                    ortg: (active.reduce((s, p) => s + p.ortg, 0) / active.length).toFixed(1),
                    drtg: (active.reduce((s, p) => s + p.drtg, 0) / active.length).toFixed(1),
                    net: ((active.reduce((s, p) => s + p.ortg, 0) / active.length) - (active.reduce((s, p) => s + p.drtg, 0) / active.length)).toFixed(1)
                } : null;
                return (
                    <div className="space-y-6">
                        <div className="grid grid-cols-5 gap-2">
                            {[0,1,2,3,4].map(i => (
                                <select key={i} className="bg-slate-800 border border-slate-700 text-white text-sm rounded p-2 w-full" onChange={(e) => {const n=[...simLineup]; n[i]=e.target.value; setSimLineup(n)}}>
                                    <option value="">Poste {i+1}...</option>
                                    {aggregatedStats.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                                </select>
                            ))}
                        </div>
                        {stats && (
                            <div className="grid grid-cols-2 gap-4">
                                <Card className="p-4 text-center border-t-4 border-purple-500">
                                    <div className="text-4xl font-black text-white">{stats.net > 0 ? `+${stats.net}` : stats.net}</div>
                                    <div className="text-xs text-slate-400">Net Rating Est.</div>
                                </Card>
                                <Card className="p-4 flex flex-col justify-center gap-2">
                                    <div className="flex justify-between text-sm"><span className="text-green-400">ORtg: {stats.ortg}</span> <span className="text-red-400">DRtg: {stats.drtg}</span></div>
                                </Card>
                            </div>
                        )}
                    </div>
                );
            };

            const tabs = [
                { id: "dashboard", label: "Dashboard", icon: Icons.Chart, comp: renderDashboard },
                { id: "reco", label: "🤖 Coach IA", icon: Icons.Robot, comp: renderAIRecommendation },
                { id: "assistant", label: "Chat IA", icon: Icons.Sparkles, comp: () => <CoachAssistant aggregatedStats={aggregatedStats} apiKey={apiKey} /> },
                { id: "sim", label: "Simulateur", icon: Icons.Zap, comp: renderSim },
            ];

            return (
                <div className="flex flex-col h-full">
                    <div className="flex gap-1 border-b border-slate-700 mb-4 overflow-x-auto no-scrollbar">
                        {tabs.map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex items-center gap-2 px-4 py-3 text-sm font-medium whitespace-nowrap transition-colors ${activeTab === t.id ? 'text-coach-accent border-b-2 border-coach-accent bg-slate-800/50' : 'text-slate-400'}`}>
                                <Icon path={t.icon} /> {t.label}
                            </button>
                        ))}
                    </div>
                    <div className="flex-1 overflow-y-auto pb-20">{tabs.find(t => t.id === activeTab)?.comp()}</div>
                </div>
            );
        };

        const Settings = ({ players, onUpdatePlayers, apiKey, setApiKey }) => {
            const addPlayer = () => {
                const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
                onUpdatePlayers([...players, { id: newId, name: "Nouveau Joueur", number: 0, pos: "G", style: "Rookie", height: 190 }]);
            };

            const removePlayer = (id) => {
                if (confirm("Supprimer ce joueur définitivement ?")) {
                    onUpdatePlayers(players.filter(p => p.id !== id));
                }
            };

            return (
                <div className="space-y-6">
                    <Card className="p-6 border-l-4 border-purple-500 bg-gradient-to-br from-slate-800 to-slate-900">
                        <h3 className="text-lg font-bold text-white flex items-center gap-2 mb-2"><Icon path={Icons.Key} /> Configuration IA</h3>
                        <p className="text-xs text-slate-400 mb-4">Entrez votre clé API Gemini pour activer l'assistant coach et les analyses de match.</p>
                        <input 
                            type="password" 
                            className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white focus:border-purple-500 outline-none font-mono text-sm"
                            placeholder="sk-..."
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                        />
                    </Card>
                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-white">Effectif ({players.length})</h2>
                        <Button onClick={addPlayer} variant="success"><Icon path={Icons.Plus} /> Ajouter Joueur</Button>
                    </div>
                    <div className="grid gap-3">
                        {players.map((p, i) => (
                            <Card key={p.id} className="p-3 flex gap-3 items-center">
                                <div className="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center font-bold">{p.number}</div>
                                <div className="flex-1 grid grid-cols-2 md:grid-cols-4 gap-2">
                                    <input className="bg-transparent text-white font-bold w-full outline-none border-b border-slate-700 focus:border-orange-500" value={p.name} onChange={(e) => {const n=[...players]; n[i].name=e.target.value; onUpdatePlayers(n)}} placeholder="Nom" />
                                    <input className="bg-transparent text-slate-400 text-sm w-full outline-none border-b border-slate-700 focus:border-orange-500" value={p.pos} onChange={(e) => {const n=[...players]; n[i].pos=e.target.value; onUpdatePlayers(n)}} placeholder="Poste" />
                                    <input className="bg-transparent text-slate-400 text-sm w-full outline-none border-b border-slate-700 focus:border-orange-500" type="number" value={p.number} onChange={(e) => {const n=[...players]; n[i].number=parseInt(e.target.value); onUpdatePlayers(n)}} placeholder="Num" />
                                </div>
                                <button onClick={() => removePlayer(p.id)} className="text-red-500 hover:text-red-300 p-2"><Icon path={Icons.Trash} /></button>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        };

        const History = ({ games, setGames, apiKey }) => {
            const [analyzing, setAnalyzing] = useState(null);
            const [modalContent, setModalContent] = useState(null);

            const analyzeMatch = async (game) => {
                if (!apiKey) { alert("Configurez votre clé API dans les paramètres !"); return; }
                setAnalyzing(game.id);
                try {
                    const prompt = `
                        Agis comme un journaliste sportif spécialisé basket.
                        Écris un résumé de match court, percutant et analytique (max 150 mots) basé sur ces données :
                        Match : ${game.location} contre ${game.opponent}.
                        Score : Nous ${game.homeScore} - ${game.awayScore} Eux.
                        Stats Joueurs : ${JSON.stringify(game.playerStats)}.
                        Stats Adversaire (si dispo) : ${JSON.stringify(game.opponentStats || {})}.
                        Mets en avant le MVP du match et les clés de la victoire ou défaite.
                    `;
                    const text = await callGemini(prompt, apiKey);
                    setModalContent({ title: `Analyse vs ${game.opponent}`, body: text });
                } catch (e) { alert("Erreur analyse"); }
                setAnalyzing(null);
            };

            return (
                <div className="space-y-4">
                    {games.map(g => (
                        <Card key={g.id} className="p-4 flex flex-col gap-4">
                            <div className="flex justify-between items-center">
                                <div>
                                    <div className="text-sm text-slate-400">{g.date} - {g.location}</div>
                                    <div className="text-xl font-bold text-white"><span className="text-green-400">{g.homeScore}</span> - <span className="text-red-400">{g.awayScore}</span> vs {g.opponent}</div>
                                </div>
                                <div className="flex gap-2">
                                    <Button variant="magic" size="sm" onClick={() => analyzeMatch(g)} disabled={analyzing === g.id}>
                                        {analyzing === g.id ? "..." : <><Icon path={Icons.Sparkles} /> Analyser</>}
                                    </Button>
                                    <Button variant="danger" size="sm" onClick={() => confirm("Supprimer ?") && setGames(games.filter(x => x.id !== g.id))}><Icon path={Icons.Trash} /></Button>
                                </div>
                            </div>
                        </Card>
                    ))}
                    <Modal isOpen={!!modalContent} onClose={() => setModalContent(null)} title={modalContent?.title}>
                        <div className="markdown-body text-slate-300 leading-relaxed" dangerouslySetInnerHTML={{ __html: marked.parse(modalContent?.body || "") }} />
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState("live");
            const [players, setPlayers] = useState([]);
            const [games, setGames] = useState([]);
            const [apiKey, setApiKey] = useState("");

            useEffect(() => {
                setPlayers(JSON.parse(localStorage.getItem('basket_players')) || defaultPlayers);
                setGames(JSON.parse(localStorage.getItem('basket_games')) || []);
                setApiKey(localStorage.getItem('gemini_api_key') || "");
            }, []);

            useEffect(() => { localStorage.setItem('basket_players', JSON.stringify(players)); }, [players]);
            useEffect(() => { localStorage.setItem('basket_games', JSON.stringify(games)); }, [games]);
            useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);

            const handleSaveGame = (gs) => {
                setGames([{ id: generateId(), date: new Date().toLocaleDateString(), ...gs }, ...games]);
                window.location.reload();
            };

            return (
                <div className="max-w-5xl mx-auto h-screen bg-slate-950 flex flex-col md:flex-row overflow-hidden font-sans text-slate-200">
                    <nav className="bg-slate-900 border-r border-slate-800 w-full md:w-20 flex md:flex-col items-center justify-evenly md:justify-start md:pt-6 p-2 z-50 shadow-xl shrink-0">
                        <div className="mb-0 md:mb-8 p-2 bg-orange-600 rounded-xl text-white font-black text-xl">BP</div>
                        {[
                            { id: "live", icon: Icons.Play },
                            { id: "intelligent", icon: Icons.Activity },
                            { id: "history", icon: Icons.Clipboard },
                            { id: "settings", icon: Icons.Settings }
                        ].map(btn => (
                            <button key={btn.id} onClick={() => setView(btn.id)} className={`p-3 rounded-xl transition-all ${view === btn.id ? 'bg-slate-700 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                                <Icon path={btn.icon} />
                            </button>
                        ))}
                    </nav>
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center px-6 shrink-0">
                            <h1 className="font-bold text-lg text-white flex items-center gap-2">
                                {view === 'live' && "🔴 Match en Direct"}
                                {view === 'intelligent' && "🧠 Coach OS + IA"}
                                {view === 'history' && "📜 Historique"}
                                {view === 'settings' && "⚙️ Paramètres"}
                            </h1>
                        </header>
                        <div className="flex-1 p-4 overflow-y-auto bg-slate-950 no-scrollbar">
                            {view === 'live' && <LiveTracker players={players} onSaveGame={handleSaveGame} />}
                            {view === 'intelligent' && <CoachOS players={players} games={games} apiKey={apiKey} />}
                            {view === 'history' && <History games={games} setGames={setGames} apiKey={apiKey} />}
                            {view === 'settings' && <Settings players={players} onUpdatePlayers={setPlayers} apiKey={apiKey} setApiKey={setApiKey} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
