<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stat Champagne Basket U18 Elite 2025-2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Firebase (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'court-orange': '#e65100',
                        'coach-dark': '#1e293b',
                        'coach-accent': '#f97316',
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .sticky-col { position: sticky; left: 0; background-color: #1e293b; z-index: 20; border-right: 1px solid #334155; }
        .sticky-header { position: sticky; top: 0; z-index: 30; }

        @media print {
            body { background-color: white; color: black; }
            .no-print, nav, header, button, .modal-close { display: none !important; }
            .print-only { display: block !important; }
            .card-stats { border: 1px solid #ccc; box-shadow: none; page-break-inside: avoid; overflow: visible !important; }
            table { width: 100%; border-collapse: collapse; font-size: 8pt; }
            th, td { border: 1px solid #ddd; padding: 2px; color: black !important; }
            th { background-color: #f3f4f6 !important; font-weight: bold; }
            .sticky-col { position: static; background-color: transparent; border: none; }
            .sticky-header { position: static; }
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- Chargement du fichier JS externe avec Babel -->
     <script>
            fetch('PlayByPlayEditor.js')
            .then(response => response.text())
            .then(code => {
                const transformed = Babel.transform(code, { presets: ['react'] }).code;
                const script = document.createElement('script');
                script.textContent = transformed;
                document.body.appendChild(script);
            })
            .catch(err => {
                console.error('Erreur chargement PlayByPlayEditor.js:', err);
                document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;">Erreur: Impossible de charger PlayByPlayEditor.js. Assurez-vous que le fichier existe et que vous utilisez un serveur local (pas file://).</div>';
            });

     </script>
     
     <script>
     fetch('ReportPlayer.js')
            .then(response => response.text())
            .then(code => {
                const transformed = Babel.transform(code, { presets: ['react'] }).code;
                const script = document.createElement('script');
                script.textContent = transformed;
                document.body.appendChild(script);
            })
            .catch(err => {
                console.error('Erreur chargement ReportPlayer.js:', err);
                document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;">Erreur: Impossible de charger ReportPlayer.js. Assurez-vous que le fichier existe et que vous utilisez un serveur local (pas file://).</div>';
            });</script>
    <script>
        // Babel standalone ne supporte pas src="", on doit charger manuellement
        fetch('app.js')
            .then(response => response.text())
            .then(code => {
                const transformed = Babel.transform(code, { presets: ['react'] }).code;
                const script = document.createElement('script');
                script.textContent = transformed;
                document.body.appendChild(script);
            })
            .catch(err => {
                console.error('Erreur chargement app.js:', err);
                document.getElementById('root').innerHTML = '<div style="color:red;padding:20px;">Erreur: Impossible de charger app.js. Assurez-vous que le fichier existe et que vous utilisez un serveur local (pas file://).</div>';
            });
    </script>
</body>
</html>
