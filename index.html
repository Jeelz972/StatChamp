        const { useState, useEffect, useMemo, useRef } = React;
        const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, LineChart, Line, CartesianGrid } = window.Recharts || {};

        // --- UTILS & HELPERS ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const defaultPlayers = [
            { id: 1, name: "Meneur A", number: 4, pos: "PG" },
            { id: 2, name: "Arrière B", number: 5, pos: "SG" },
            { id: 3, name: "Ailier C", number: 8, pos: "SF" },
            { id: 4, name: "Intérieur D", number: 12, pos: "PF" },
            { id: 5, name: "Pivot E", number: 15, pos: "C" },
        ];

        // Logic to calculate stats from a list of actions
        const recalculateGameStats = (actions, players) => {
            const pStats = {};
            players.forEach(p => pStats[p.id] = { pts: 0, reb: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fga: 0, fgm: 0, fta: 0, ftm: 0, pf: 0, pointsAllowed: 0, minutes: 0, plusMinus: 0 });
            const oppStats = { pts: 0, reb: 0, ast: 0, tov: 0, fouls: 0, fga: 0, fgm: 0, fta: 0, ftm: 0 };
            let home = 0, away = 0;

            actions.forEach(act => {
                const { type, playerId, consequence, onCourt } = act;
                let ptsScored = 0, ptsConceded = 0;

                if (playerId === 'OPP') {
                    if (type.includes('FGM')) { 
                        const val = type === 'FGM1' ? 1 : type === 'FGM2' ? 2 : 3; 
                        oppStats.pts += val; away += val; ptsConceded = val; 
                    }
                    if (type === 'PF') oppStats.fouls++;
                    if (consequence && consequence.includes('score')) {
                        const val = parseInt(consequence.split('_')[1]);
                        home += val; ptsScored = val;
                    }
                } else if (pStats[playerId]) {
                    const ps = pStats[playerId];
                    if (type.includes('FGM')) {
                        const val = type === 'FGM1' ? 1 : type === 'FGM2' ? 2 : 3;
                        ps.pts += val; home += val; ptsScored = val;
                    }
                    if (type === 'PF') ps.pf++;
                    if (consequence && consequence.includes('score')) {
                        const val = parseInt(consequence.split('_')[1]);
                        ps.pointsAllowed += val; away += val; ptsConceded = val;
                    }
                }
                
                if (onCourt && Array.isArray(onCourt)) {
                    onCourt.forEach(pid => {
                        if (pStats[pid]) {
                            pStats[pid].plusMinus += ptsScored;
                            pStats[pid].plusMinus -= ptsConceded;
                        }
                    });
                }
            });
            return { playerStats: pStats, opponentStats: oppStats, homeScore: home, awayScore: away };
        };

        const calculateAdvancedStats = (stats, minOverride = null) => {
            const min = minOverride !== null ? minOverride : (stats.minutes || 0);
            const eff = (stats.pts + (stats.oreb + stats.dreb) + stats.ast + stats.stl + stats.blk) - 
                        ((stats.fga - stats.fgm) + (stats.fta - stats.ftm) + stats.tov);
            const poss = stats.fga + (0.44 * stats.fta) + stats.tov;
            const ortg = poss > 0 ? (stats.pts / poss) * 100 : 0;
            const drtg = poss > 0 ? (stats.pointsAllowed / poss) * 100 : 100;
            return {
                eff: eff,
                effPerMin: min > 0 ? (eff / min) : 0,
                ortg: parseFloat(ortg.toFixed(1)),
                drtg: parseFloat(drtg.toFixed(1)),
                netRtg: parseFloat((ortg - drtg).toFixed(1)),
                poss: parseFloat(poss.toFixed(1))
            };
        };

        const callGemini = async (prompt, apiKey) => {
            if (!apiKey) throw new Error("Clé API manquante");
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            if (!response.ok) throw new Error("Erreur API");
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        };

        // --- ICONS ---

        const Icons = {

            Play: "M5 3l14 9-14 9V3z",

            Save: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8V3",
            Chart: "M18 20V10 M12 20V4 M6 20v-6",

            Undo: "M3 7v6h6 M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13",
            Sparkles: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
            MessageSquare: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
            Key: "M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
            Plus: "M12 5v14M5 12h14",
            Robot: "M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z",
            Eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8-11-8-11-8z M12 5c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7z M12 15c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z",
            List: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
            Check: "M20 6L9 17l-5-5",
            Edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
            Pause: "M10 9v6 M14 9v6",
            Timer: "M12 2v2M12 22v-2M2 12h2M22 12h-2M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M19.07 4.93l-1.41 1.41",
            Upload: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12",
            Link: "M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71",
            Database: "M12 2.5c5 0 9 1.8 9 4s-4 4-9 4-9-1.8-9-4 4-4 9-4zm0 6c4.6 0 8.4-1.5 8.9-3.5v5c0 2.2-4 4-9 4s-9-1.8-9-4v-5c.5 2 4.3 3.5 8.9 3.5zm0 6c4.6 0 8.4-1.5 8.9-3.5v5c0 2.2-4 4-9 4s-9-1.8-9-4v-5c.5 2 4.3 3.5 8.9 3.5z",
            Cloud: "M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z",
            Share: "M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8 M16 6l-4-4-4 4 M12 2v13"
        };

        // --- COMMON COMPONENTS ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = "primary", className = "", size = "md", disabled=false, as="button", ...props }) => {
            const base = "font-semibold rounded transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer";
            const variants = {
                primary: "bg-coach-accent hover:bg-orange-600 text-white shadow-md",
                secondary: "bg-slate-700 hover:bg-slate-600 text-slate-200",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                success: "bg-green-600 hover:bg-green-700 text-white",
                ghost: "bg-transparent hover:bg-slate-700 text-slate-400",
                magic: "bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white shadow-lg border border-purple-400/30"
            };
            const sizes = { sm: "px-2 py-1 text-xs", md: "px-4 py-2 text-sm", lg: "px-6 py-3 text-lg" };
            
            if (as === "label") {
                return <label onClick={onClick} className={`${base} ${variants[variant]} ${sizes[size]} ${className}`} {...props}>{children}</label>;
            }
            return (
                <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed':''}`} {...props}>
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
                    <div className="bg-slate-800 rounded-xl border border-slate-600 w-full max-w-2xl shadow-2xl transform transition-all scale-100 max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center p-4 border-b border-slate-700 shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl">&times;</button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- LIVE TRACKER ---
        const LiveTracker = ({ players, onSaveGame, initialGame }) => {
            const [gameState, setGameState] = useState({
                quarter: 1, opponent: "Adversaire", location: "Domicile",
                actions: []
            });
            const [gameTime, setGameTime] = useState(0); 
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [onCourt, setOnCourt] = useState([]); 
            const [accumulatedMinutes, setAccumulatedMinutes] = useState({});

            const [derived, setDerived] = useState(recalculateGameStats([], players));
            const [modal, setModal] = useState({ type: null, data: null });
            const [showStats, setShowStats] = useState(false);

            useEffect(() => {
                if (initialGame) setGameState(prev => ({...prev, ...initialGame}));
            }, [initialGame]);

            useEffect(() => {
                setDerived(recalculateGameStats(gameState.actions, players));
            }, [gameState.actions, players]);

            useEffect(() => {
                let interval;
                if (isTimerRunning) {
                    interval = setInterval(() => {
                        setGameTime(p => p + 1);
                        setAccumulatedMinutes(prev => {
                            const next = { ...prev };
                            onCourt.forEach(id => next[id] = (next[id] || 0) + 1);
                            return next;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, onCourt]);

            const registerAction = (actionType, player, extraData = {}) => {
                const newAction = {
                    id: generateId(),
                    type: actionType,
                    playerId: player === 'opponent' ? 'OPP' : player.id,
                    playerName: player === 'opponent' ? 'Adversaire' : player.name,
                    q: gameState.quarter,
                    consequence: extraData.consequence,
                    timestamp: new Date().toLocaleTimeString(),
                    onCourt: [...onCourt]
                };
                setGameState(prev => ({ ...prev, actions: [...prev.actions, newAction] }));
                setModal({ type: null, data: null });
            };

            const togglePlayerOnCourt = (id) => {
                if (onCourt.includes(id)) setOnCourt(p => p.filter(x => x !== id));
                else if (onCourt.length < 5) setOnCourt(p => [...p, id]);
            };

            const finalizeGame = () => {
                const finalStats = { ...derived.playerStats };
                Object.keys(accumulatedMinutes).forEach(pid => {
                    if (finalStats[pid]) finalStats[pid].minutes += Math.round(accumulatedMinutes[pid] / 60);
                });
                onSaveGame({ ...gameState, ...derived, playerStats: finalStats });
            };

            return (
                <div className="flex flex-col h-full gap-4 relative">
                    <div className="bg-slate-800 p-2 flex justify-between items-center rounded-lg border border-slate-700">
                        <div className="flex items-center gap-4">
                            <Button size="sm" className={isTimerRunning ? "bg-red-500" : "bg-green-500"} onClick={() => setIsTimerRunning(!isTimerRunning)}>
                                <Icon path={isTimerRunning ? Icons.Pause : Icons.Play} /> {isTimerRunning ? "Stop" : "Start"}
                            </Button>
                            <div className="font-mono text-xl text-white font-bold">
                                {Math.floor(gameTime / 60).toString().padStart(2, '0')}:{(gameTime % 60).toString().padStart(2, '0')}
                            </div>
                        </div>
                        <div className="text-xs text-slate-400">Joueurs: <span className={onCourt.length===5?"text-green-400":"text-orange-400"}>{onCourt.length}/5</span></div>
                    </div>

                    <Card className="bg-slate-900 p-4 flex justify-between items-center sticky top-0 z-10 border-b-4 border-coach-accent">
                        <div className="text-4xl font-bold text-white">{derived.homeScore}</div>
                        <div className="flex flex-col items-center">
                            <div className="text-xl font-bold text-orange-500">Q{gameState.quarter}</div>
                            <div className="flex gap-2 mt-1">
                                <button onClick={() => setGameState(p=>({...p, quarter: Math.max(1, p.quarter-1)}))} className="text-xs text-slate-500 hover:text-white">-</button>
                                <button onClick={() => setGameState(p=>({...p, quarter: p.quarter+1}))} className="text-xs text-slate-500 hover:text-white">+</button>
                            </div>
                        </div>
                        <div className="text-4xl font-bold text-red-500">{derived.awayScore}</div>
                    </Card>

                    <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-4 gap-3 pb-20">
                        {players.map(player => {
                            const pStats = derived.playerStats[player.id] || { pts: 0, pf: 0, plusMinus: 0 };
                            const isOnCourt = onCourt.includes(player.id);
                            return (
                                <div key={player.id} className={`relative p-3 rounded-xl border shadow-md transition-all ${isOnCourt ? 'bg-slate-800 border-orange-500 ring-1 ring-orange-500/50' : 'bg-slate-800/60 border-slate-700 opacity-80'}`}>
                                    <div className="absolute top-2 right-2 z-20"><input type="checkbox" checked={isOnCourt} onChange={() => togglePlayerOnCourt(player.id)} className="w-5 h-5 accent-orange-500 cursor-pointer" /></div>
                                    <div onClick={() => setModal({ type: "ACTION_MENU", data: player })} className="cursor-pointer">
                                        <div className="flex justify-between pr-6">
                                            <span className={`font-bold truncate ${isOnCourt ? 'text-white' : 'text-slate-400'}`}>{player.name}</span>
                                            <span className="text-xs text-slate-500">#{player.number}</span>
                                        </div>
                                        <div className="text-xs mt-2 flex justify-between items-end">
                                            <div className="space-x-2 text-slate-300">
                                                <span>Pts: <b className="text-white">{pStats.pts}</b></span>
                                                <span>+/-: <b className={pStats.plusMinus >= 0 ? "text-green-400" : "text-red-400"}>{pStats.plusMinus > 0 ? '+' : ''}{pStats.plusMinus}</b></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        <div onClick={() => setModal({ type: "ACTION_MENU", data: "opponent" })} className="bg-red-900/40 p-3 rounded-xl border border-red-700 shadow-md hover:border-red-500 cursor-pointer flex flex-col items-center justify-center text-center">
                            <span className="font-bold text-red-200">{gameState.opponent.toUpperCase()}</span>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-slate-900 p-4 border-t border-slate-800 flex justify-end z-20 gap-2">
                        <Button variant="secondary" onClick={() => setShowStats(true)}><Icon path={Icons.Eye} /> Stats</Button>
                        <Button variant="success" onClick={finalizeGame}><Icon path={Icons.Check} /> Finir</Button>
                    </div>

                    <Modal isOpen={modal.type === "ACTION_MENU"} onClose={() => setModal({type:null})} title={modal.data?.name || "Adversaire"}>
                        <div className="grid grid-cols-3 gap-3">
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM2", modal.data)}>+2 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM3", modal.data)}>+3 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM1", modal.data)}>+1 LF</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA2", modal.data)}>Miss 2</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA3", modal.data)}>Miss 3</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA1", modal.data)}>Miss LF</Button>
                            <div className="col-span-3 h-px bg-slate-600 my-1"></div>
                            <Button className="bg-blue-600" onClick={() => registerAction("DREB", modal.data)}>Reb D</Button>
                            <Button className="bg-blue-500" onClick={() => registerAction("OREB", modal.data)}>Reb O</Button>
                            <Button className="bg-purple-600" onClick={() => registerAction("AST", modal.data)}>Passe</Button>
                            <Button className="bg-yellow-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_STL", data: modal.data}) : registerAction("STL", "opponent")}>Int</Button>
                            <Button className="bg-orange-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_TOV", data: modal.data}) : registerAction("TOV", "opponent")}>Balle P.</Button>
                            <Button className="bg-slate-600" onClick={() => registerAction("BLK", modal.data)}>Contre</Button>
                            <Button variant="danger" className="col-span-3 mt-2" onClick={() => registerAction("PF", modal.data)}>Faute Perso</Button>
                        </div>
                    </Modal>

                    <Modal isOpen={modal.type === "CONSEQ_TOV"} onClose={() => setModal({type:null})} title="Conséquence Balle Perdue ?">

        const CoachOS = ({ players, games, apiKey }) => {
            const [activeTab, setActiveTab] = useState("reco");
            const aggregatedStats = useMemo(() => {
                const stats = {};
                players.forEach(p => stats[p.id] = { ...p, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, tov: 0, fga: 0, fgm: 0, fta: 0, ftm: 0, pf: 0, plusMinus: 0 });
                games.forEach(g => {
                    Object.entries(g.playerStats).forEach(([pid, ps]) => {
                        if (stats[pid]) {
                            stats[pid].gp++; 
                            stats[pid].min += (ps.minutes||0); 
                            stats[pid].pts += ps.pts; stats[pid].reb += ps.reb; stats[pid].ast += ps.ast; 
                            stats[pid].tov += ps.tov; stats[pid].fga += ps.fga; stats[pid].fgm += ps.fgm;
                            stats[pid].plusMinus += (ps.plusMinus || 0);
                        }
                    });
                });
                return Object.values(stats).map(s => ({ ...s, ...calculateAdvancedStats(s, s.min) }));
            }, [games, players]);

            const renderSmartRating = () => {
                const avgEfficiency = aggregatedStats.reduce((acc, p) => acc + p.effPerMin, 0) / (aggregatedStats.length || 1);
                const ratedPlayers = aggregatedStats.map(p => {
                    const min = p.min;
                    const confidence = 1 / (1 + Math.exp(-0.2 * (min - 10))); 
                    const adjustedEff = (p.effPerMin * confidence) + (avgEfficiency * (1 - confidence));
                    const rating = (adjustedEff * 40) + (p.plusMinus * 0.2); 
                    return { ...p, confidence, rating, adjustedEff };
                }).sort((a, b) => b.rating - a.rating);
                const top5 = ratedPlayers.slice(0, 5);

                return (
                    <div className="space-y-4 animate-fade-in">

        const ImportReviewModal = ({ importData, currentPlayers, onConfirm, onCancel }) => {

                    const match = currentPlayers.find(p => p.number === imp.number);
                    if (match) {
                        initialMap[idx] = match.id;
                    } else {
                        initialMap[idx] = "NEW";
                    }
                });
                setMapping(initialMap);
            }, [importData, currentPlayers]);

            const handleFinalize = () => {
                const finalGameStats = {};
                const newPlayersList = [...currentPlayers];
                let maxId = currentPlayers.length > 0 ? Math.max(...currentPlayers.map(p => p.id)) : 0;

                importData.rawPlayers.forEach((imp, idx) => {
                    const choice = mapping[idx];
                    let pid;
                    if (choice === "NEW") {
                        maxId++;
                        pid = maxId;
                        newPlayersList.push({ id: pid, name: imp.name, number: imp.number, pos: "G" });
                    } else if (choice === "SKIP") {
                        return;
                    } else {
                        pid = parseInt(choice);

                    finalGameStats[pid] = imp.stats;
                });

                const newGame = {
                    id: generateId(),
                    ...importData.meta,
                    playerStats: finalGameStats,
                    opponentStats: importData.opponentStats,
                    actions: []

        const parseHTMLStats = (html) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            
            const date = doc.querySelector('#game-date span.detail')?.textContent || new Date().toLocaleDateString();
            const homeName = doc.querySelector('#team-names-container .left span.detail')?.textContent || "Nous";
            const awayName = doc.querySelector('#team-names-container .right span.detail')?.textContent || "Adversaire";
            const homeScore = parseInt(doc.querySelector('#team-score-left .title')?.textContent || "0");
            const awayScore = parseInt(doc.querySelector('#team-score-right .title')?.textContent || "0");

            const rawPlayers = [];
            const table = doc.querySelector('table#stats');
            let opponentStats = { pts: 0, reb: 0, ast: 0, tov: 0, fouls: 0 };

            if (table) {
                const rows = table.querySelectorAll('tr');
                rows.forEach(row => {
                    const cells = row.querySelectorAll('td');
                    if (cells.length < 15) return;

                    const nameCell = cells[0].textContent.trim();
                    if (nameCell.includes(awayName)) {
                         opponentStats = {
                            pts: parseInt(cells[15].textContent) || 0,
                            reb: (parseInt(cells[6].textContent)||0) + (parseInt(cells[7].textContent)||0),
                            ast: parseInt(cells[12].textContent) || 0,
                            tov: parseInt(cells[10].textContent) || 0,
                            fouls: parseInt(cells[8].textContent) || 0
                        };
                        return;
                    }
                    if (!nameCell.startsWith('#')) return; 

                    const parts = nameCell.split(' ');
                    const numberStr = parts[0].replace('#', '');
                    const number = parseInt(numberStr);
                    const name = parts.slice(1).join(' ');

                    const parseSplit = (txt) => { 
                        if (!txt) return { made: 0, att: 0 };
                        const [m, a] = txt.split('-'); 
                        return { made: parseInt(m)||0, att: parseInt(a)||0 }; 
                    };
                    const fg = parseSplit(cells[1].textContent);
                    const tp = parseSplit(cells[3].textContent);
                    const ft = parseSplit(cells[5].textContent);
                    
                    const twoPM = fg.made - tp.made;
                    const twoPA = fg.att - tp.att;

                    const stats = {
                        pts: parseInt(cells[15].textContent) || 0,
                        reb: (parseInt(cells[6].textContent)||0) + (parseInt(cells[7].textContent)||0),
                        oreb: parseInt(cells[6].textContent) || 0,
                        dreb: parseInt(cells[7].textContent) || 0,
                        ast: parseInt(cells[12].textContent) || 0,
                        stl: parseInt(cells[9].textContent) || 0,
                        blk: parseInt(cells[11].textContent) || 0,
                        tov: parseInt(cells[10].textContent) || 0,
                        pf: parseInt(cells[8].textContent) || 0,
                        fgm: twoPM, fga: twoPA, 
                        ftm: ft.made, fta: ft.att,
                        minutes: parseInt(cells[14].textContent) || 0,
                        plusMinus: parseInt(cells[13].textContent) || 0,
                    };
                    rawPlayers.push({ name, number, stats });
                });
            }

            return {
                meta: { date, opponent: awayName, homeScore, awayScore, location: "Importé" },
                rawPlayers,
                opponentStats
            };
        };

                    <Modal isOpen={!!viewDetail} onClose={() => setViewDetail(null)} title={`Détails vs ${viewDetail?.opponent}`}>

                                <div className="bg-slate-900 p-4 rounded-lg text-center border border-slate-700">
                                    <h4 className="text-slate-400 uppercase text-xs">Score Final</h4>
                                    <div className="text-3xl font-bold text-white">
                                        <span className="text-green-400">{viewDetail.homeScore}</span> - <span className="text-red-400">{viewDetail.awayScore}</span>
                                    </div>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs text-slate-300">
                                        <thead className="bg-slate-700 text-white uppercase">
                                            <tr>
                                                <th className="p-2">Joueur</th>
                                                <th className="p-2">MIN</th>
                                                <th className="p-2">PTS</th>
                                                <th className="p-2">REB</th>
                                                <th className="p-2">AST</th>
                                                <th className="p-2">STL</th>
                                                <th className="p-2">BLK</th>
                                                <th className="p-2">TOV</th>
                                                <th className="p-2 text-green-400">EFF</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700">
                                            {Object.entries(viewDetail.playerStats).map(([pid, s]) => {
                                                const eff = (s.pts + s.reb + s.ast + s.stl + s.blk) - ((s.fga - s.fgm) + (s.fta - s.ftm) + s.tov);
                                                // Player Name Lookup
                                                const player = players.find(p => p.id === parseInt(pid));
                                                const pName = player ? player.name : `Inconnu #${pid}`;
                                                
                                                return (
                                                    <tr key={pid}>
                                                        <td className="p-2 font-bold">{pName}</td>
                                                        <td className="p-2">{s.minutes}</td>
                                                        <td className="p-2">{s.pts}</td>
                                                        <td className="p-2">{s.reb}</td>
                                                        <td className="p-2">{s.ast}</td>
                                                        <td className="p-2">{s.stl}</td>
                                                        <td className="p-2">{s.blk}</td>
                                                        <td className="p-2">{s.tov}</td>
                                                        <td className="p-2 font-bold text-green-400">{eff}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const Settings = ({ players, onUpdatePlayers, apiKey, setApiKey, firebaseConfig, setFirebaseConfig }) => {
            const [localConfig, setLocalConfig] = useState(JSON.stringify(firebaseConfig, null, 2) || "");
            
            const handleSaveConfig = () => {
                try {
                    let parsed;
                    try {
                        parsed = JSON.parse(localConfig);
                    } catch (e) {
                        // Relaxed JSON parsing for JS objects
                        const fixed = localConfig.replace(/(['"])?([a-zA-Z0-9_]+)(['"])?:/g, '"$2":').replace(/'/g, '"');
                        parsed = JSON.parse(fixed);
                    }
                    setFirebaseConfig(parsed);
                    alert("Configuration Firebase sauvegardée ! Rechargez la page.");
                } catch (e) {
                    alert("Erreur de format JSON. Vérifiez la syntaxe.");
                }
            };

            const generatePlayerLink = () => {
                const url = new URL(window.location.href);
                url.searchParams.set('mode', 'player');
                navigator.clipboard.writeText(url.toString());
                alert("Lien 'Joueur' copié dans le presse-papier !");
            };

            const addPlayer = () => {
                const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
                onUpdatePlayers([...players, { id: newId, name: "Nouveau", number: 0, pos: "G" }]);
            };

            return (
                <div className="space-y-6">
                    <Card className="p-6 border-l-4 border-purple-500 bg-gradient-to-br from-slate-800 to-slate-900">
                        <h3 className="text-lg font-bold text-white flex items-center gap-2 mb-4"><Icon path={Icons.Settings} /> Synchronisation Cloud</h3>
                        <p className="text-sm text-slate-400 mb-2">Pour synchroniser les données entre appareils, collez votre configuration Firebase ci-dessous.</p>
                        <textarea 
                            className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-white font-mono h-32 mb-2"
                            placeholder='{ "apiKey": "...", "authDomain": "...", ... }'
                            value={localConfig}
                            onChange={(e) => setLocalConfig(e.target.value)}
                        />
                        <Button onClick={handleSaveConfig} variant="secondary" size="sm">Sauvegarder Config Cloud</Button>
                    </Card>

                    <Card className="p-6">
                         <h3 className="text-lg font-bold text-white mb-4">Partage</h3>
                         <div className="flex items-center justify-between">
                            <span className="text-slate-400 text-sm">Générer un lien en lecture seule pour les joueurs.</span>
                            <Button onClick={generatePlayerLink} variant="magic"><Icon path={Icons.Share} /> Générer Lien Joueurs</Button>
                         </div>
                    </Card>

                    <div className="flex justify-between items-center">
                        <h2 className="text-2xl font-bold text-white">Effectif</h2>
                        <Button onClick={addPlayer} variant="success"><Icon path={Icons.Plus} /> Ajouter Joueur</Button>
                    </div>
                    <div className="grid gap-3">
                        {players.map((p, i) => (
                            <Card key={p.id} className="p-3 flex gap-3 items-center">
                                <div className="w-10 h-10 bg-slate-700 rounded-full flex items-center justify-center font-bold">{p.number}</div>
                                <div className="flex-1 grid grid-cols-2 gap-2">
                                    <input className="bg-transparent text-white font-bold w-full outline-none" value={p.name} onChange={(e) => {const n=[...players]; n[i].name=e.target.value; onUpdatePlayers(n)}} />
                                    <input className="bg-transparent text-slate-400 text-sm w-full outline-none" value={p.pos} onChange={(e) => {const n=[...players]; n[i].pos=e.target.value; onUpdatePlayers(n)}} />
                                </div>
                                <button onClick={() => onUpdatePlayers(players.filter(x => x.id !== p.id))} className="text-red-500 hover:text-red-300 p-2"><Icon path={Icons.Trash} /></button>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState("live");
            const [players, setPlayers] = useState([]);
            const [games, setGames] = useState([]);
            const [apiKey, setApiKey] = useState("");
            const [activeGame, setActiveGame] = useState(null);
            
            // Firebase & Sync
            const [firebaseConfig, setFirebaseConfig] = useState(null);
            const [isCloudEnabled, setIsCloudEnabled] = useState(false);
            const [db, setDb] = useState(null);

            // Import State
            const [importData, setImportData] = useState(null);

            // Player Mode
            const isPlayerMode = useMemo(() => {
                return new URLSearchParams(window.location.search).get('mode') === 'player';
            }, []);

            // Initial Load
            useEffect(() => {
                const savedFbConfig = localStorage.getItem('basket_firebase_config');
                const savedApiKey = localStorage.getItem('gemini_api_key');
                if (savedApiKey) setApiKey(savedApiKey);

                if (savedFbConfig) {
                    try {
                        const config = JSON.parse(savedFbConfig);
                        setFirebaseConfig(config);
                    } catch (e) { console.error("Invalid Firebase Config in LocalStorage"); }
                }

                if (!savedFbConfig) {
                    setPlayers(JSON.parse(localStorage.getItem('basket_players')) || defaultPlayers);
                    setGames(JSON.parse(localStorage.getItem('basket_games')) || []);
                }
            }, []);

            // Firebase Init
            useEffect(() => {
                if (firebaseConfig && window.Firebase) {
                    try {
                        const app = window.Firebase.initializeApp(firebaseConfig);
                        const database = window.Firebase.getFirestore(app);
                        setDb(database);
                        setIsCloudEnabled(true);
                        console.log("Firebase Connected");

                        const unsubPlayers = window.Firebase.onSnapshot(window.Firebase.doc(database, "team_data", "roster"), (doc) => {
                            if (doc.exists()) setPlayers(doc.data().list);
                        });
                        const unsubGames = window.Firebase.onSnapshot(window.Firebase.doc(database, "team_data", "games"), (doc) => {
                            if (doc.exists()) setGames(doc.data().list);
                        });

                        return () => { unsubPlayers(); unsubGames(); };
                    } catch (e) {
                        console.error("Firebase Init Error", e);
                        setIsCloudEnabled(false);
                    }
                }
            }, [firebaseConfig]);

            useEffect(() => {
                if (isCloudEnabled && db) {
                    window.Firebase.setDoc(window.Firebase.doc(db, "team_data", "roster"), { list: players });
                } else {
                    localStorage.setItem('basket_players', JSON.stringify(players));
                }
            }, [players, isCloudEnabled, db]);

            useEffect(() => {
                if (isCloudEnabled && db) {
                    window.Firebase.setDoc(window.Firebase.doc(db, "team_data", "games"), { list: games });
                } else {
                    localStorage.setItem('basket_games', JSON.stringify(games));
                }
            }, [games, isCloudEnabled, db]);

            useEffect(() => {
                if (firebaseConfig) localStorage.setItem('basket_firebase_config', JSON.stringify(firebaseConfig));
            }, [firebaseConfig]);
            
            useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);

            const handleSaveGame = (gameState) => {
                const gameId = activeGame?.id || generateId();
                const newGame = { ...gameState, id: gameId, date: activeGame?.date || new Date().toLocaleDateString() };
                setGames(prev => {
                    const exists = prev.find(g => g.id === gameId);
                    return exists ? prev.map(g => g.id === gameId ? newGame : g) : [newGame, ...prev];
                });
                setActiveGame(null);
                setView('history');
            };

            const handleFileImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const result = parseHTMLStats(event.target.result);
                    setImportData(result);
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const confirmImport = (newGame, updatedPlayers) => {
                setPlayers(updatedPlayers);
                setGames(prev => [newGame, ...prev]);
                setImportData(null);
                alert("Match importé avec succès !");
                setView('history');
            };

            if (isPlayerMode) {
                return (
                    <div className="max-w-5xl mx-auto h-screen bg-slate-950 flex flex-col font-sans text-slate-200">
                         <header className="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center px-6 shrink-0 justify-between">
                            <h1 className="font-bold text-lg text-white">🏀 Stats Saison</h1>
                            <div className="text-xs text-orange-500 font-bold px-2 py-1 bg-orange-900/20 rounded border border-orange-900">Mode Joueur</div>
                        </header>
                        <div className="flex-1 p-4 overflow-y-auto bg-slate-950 no-scrollbar">
                            <GlobalStats players={players} games={games} />
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto h-screen bg-slate-950 flex flex-col md:flex-row overflow-hidden font-sans text-slate-200">
                    
                    <input 
                        type="file" 
                        accept=".html" 
                        id="html-upload" 
                        onChange={handleFileImport} 
                        className="hidden" 
                    />

                    {importData && (
                        <div className="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-800 w-full max-w-2xl rounded-xl border border-slate-600 shadow-2xl p-6">
                                <h2 className="text-2xl font-bold text-white mb-4">Vérification de l'Import</h2>
                                <ImportReviewModal 
                                    importData={importData} 
                                    currentPlayers={players} 
                                    onConfirm={confirmImport} 
                                    onCancel={() => setImportData(null)} 
                                />
                            </div>
                        </div>
                    )}

                    <nav className="bg-slate-900 border-r border-slate-800 w-full md:w-20 flex md:flex-col items-center justify-evenly md:justify-start md:pt-6 p-2 z-50 shadow-xl shrink-0">
                        <div className="mb-0 md:mb-8 p-2 bg-orange-600 rounded-xl text-white font-black text-xl">BP</div>
                        {[
                            { id: "live", icon: Icons.Play },
                            { id: "intelligent", icon: Icons.Activity },
                            { id: "global_stats", icon: Icons.Chart },
                            { id: "history", icon: Icons.Clipboard },
                            { id: "settings", icon: Icons.Settings }
                        ].map(btn => (
                            <button key={btn.id} onClick={() => setView(btn.id)} className={`p-3 rounded-xl transition-all ${view === btn.id ? 'bg-slate-700 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                                <Icon path={btn.icon} />
                            </button>
                        ))}
                    </nav>
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center px-6 shrink-0">
                            <h1 className="font-bold text-lg text-white flex items-center gap-2">
                                {view === 'live' && (activeGame ? "✏️ Modifier Match" : "🔴 Match en Direct")}
                                {view === 'intelligent' && "🧠 Coach OS"}
                                {view === 'global_stats' && "📊 Stats Saison"}
                                {view === 'history' && "📜 Historique"}
                                {view === 'settings' && "⚙️ Paramètres"}
                            </h1>
                            {isCloudEnabled && <span className="ml-auto text-xs text-green-400 flex items-center gap-1"><Icon path={Icons.Cloud} /> Synchro</span>}
                        </header>
                        <div className="flex-1 p-4 overflow-y-auto bg-slate-950 no-scrollbar">
                            {view === 'live' && <LiveTracker players={players} onSaveGame={handleSaveGame} initialGame={activeGame} />}
                            {view === 'intelligent' && <CoachOS players={players} games={games} apiKey={apiKey} />}
                            {view === 'global_stats' && <GlobalStats players={players} games={games} />}
                            {view === 'history' && (
                                <History 
                                    games={games} 
                                    players={players}
                                    setGames={setGames} 
                                    apiKey={apiKey} 
                                    onEditGame={(g) => { setActiveGame(g); setView('live'); }} 
                                    onImportClick={() => document.getElementById('html-upload').click()} 
                                />
                            )}
                            {view === 'settings' && (
                                <Settings 
                                    players={players} 
                                    onUpdatePlayers={setPlayers} 
                                    apiKey={apiKey} 
                                    setApiKey={setApiKey} 
                                    firebaseConfig={firebaseConfig}
                                    setFirebaseConfig={setFirebaseConfig}
                                />
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
