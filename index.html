<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BasketCoach Pro - Live Tracker & Analytics</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Version 18) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Dependance requise pour Recharts UMD -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (Version Fixe Stable pour UMD) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'court-wood': '#f0e6d2',
                        'court-orange': '#e65100',
                        'coach-dark': '#1e293b',
                        'coach-accent': '#f97316',
                        'active-player': '#c2410c', // Couleur pour joueurs sur le terrain
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { color: #f97316; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const {
            BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer
        } = window.Recharts || {};

        // Fix console warnings
        const originalConsoleError = console.error;
        console.error = (...args) => {
            if (typeof args[0] === "string" && /defaultProps/.test(args[0])) return;
            originalConsoleError(...args);
        };

        // --- ICONS ---
        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d={path} />
            </svg>
        );
        const Icons = {
            Activity: "M22 12h-4l-3 9L9 3l-3 9H2",
            Clipboard: "M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2 M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z",
            Settings: "M12.22 2h-.44a2 2 0 0 1-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z",
            Play: "M5 3l14 9-14 9V3z",
            Trash: "M3 6h18 M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2",
            Save: "M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8V3",
            Chart: "M18 20V10 M12 20V4 M6 20v-6",
            Zap: "M13 2L3 14h9l-1 8 10-12h-9l1-8z",
            Undo: "M3 7v6h6 M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13",
            Sparkles: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
            MessageSquare: "M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z",
            Key: "M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
            Plus: "M12 5v14M5 12h14",
            Robot: "M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z",
            Eye: "M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8-11-8-11-8z M12 5c-3.866 0-7 3.134-7 7s3.134 7 7 7 7-3.134 7-7-3.134-7-7-7z M12 15c-1.657 0-3-1.343-3-3s1.343-3 3-3 3 1.343 3 3-1.343 3-3 3z",
            List: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
            Check: "M20 6L9 17l-5-5",
            Edit: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
            Pause: "M10 9v6 M14 9v6",
            Timer: "M12 2v2M12 22v-2M2 12h2M22 12h-2M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M19.07 4.93l-1.41 1.41"
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const callGemini = async (prompt, apiKey) => {
            if (!apiKey) throw new Error("Clé API manquante");
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            if (!response.ok) throw new Error("Erreur API Gemini");
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        };

        const defaultPlayers = [
            { id: 1, name: "Meneur A", number: 4, pos: "PG" },
            { id: 2, name: "Arrière B", number: 5, pos: "SG" },
            { id: 3, name: "Ailier C", number: 8, pos: "SF" },
            { id: 4, name: "Intérieur D", number: 12, pos: "PF" },
            { id: 5, name: "Pivot E", number: 15, pos: "C" },
            { id: 6, name: "Remplaçant F", number: 6, pos: "PG" },
            { id: 7, name: "Remplaçant G", number: 7, pos: "SF" },
            { id: 8, name: "Remplaçant H", number: 9, pos: "PF" },
            { id: 9, name: "Joueur I", number: 10, pos: "SG" },
            { id: 10, name: "Joueur J", number: 11, pos: "SF" },
            { id: 11, name: "Joueur K", number: 13, pos: "PF" },
            { id: 12, name: "Joueur L", number: 14, pos: "C" },
            { id: 13, name: "Joueur M", number: 16, pos: "PG" },
        ];

        const Card = ({ children, className = "" }) => (
            <div className={`bg-slate-800 rounded-lg border border-slate-700 shadow-lg overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const Button = ({ onClick, children, variant = "primary", className = "", size = "md", disabled=false }) => {
            const base = "font-semibold rounded transition-all duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-coach-accent hover:bg-orange-600 text-white shadow-md",
                secondary: "bg-slate-700 hover:bg-slate-600 text-slate-200",
                danger: "bg-red-600 hover:bg-red-700 text-white",
                success: "bg-green-600 hover:bg-green-700 text-white",
                ghost: "bg-transparent hover:bg-slate-700 text-slate-400",
                magic: "bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 text-white shadow-lg border border-purple-400/30"
            };
            const sizes = { sm: "px-2 py-1 text-xs", md: "px-4 py-2 text-sm", lg: "px-6 py-3 text-lg" };
            return (
                <button onClick={onClick} disabled={disabled} className={`${base} ${variants[variant]} ${sizes[size]} ${className} ${disabled ? 'opacity-50 cursor-not-allowed':''}`}>
                    {children}
                </button>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
                    <div className="bg-slate-800 rounded-xl border border-slate-600 w-full max-w-lg shadow-2xl transform transition-all scale-100 max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center p-4 border-b border-slate-700 shrink-0">
                            <h3 className="text-xl font-bold text-white flex items-center gap-2">{title}</h3>
                            <button onClick={onClose} className="text-slate-400 hover:text-white text-2xl">&times;</button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- LOGIC STATS ---
        const recalculateStats = (actions, players) => {
            const pStats = {};
            // Init with detail fields
            players.forEach(p => {
                pStats[p.id] = { 
                    pts: 0, reb: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, 
                    fga: 0, fgm: 0, fta: 0, ftm: 0, pf: 0, pointsAllowed: 0, minutes: 0, 
                    plusMinus: 0,
                    // Detailed consequences
                    ptsFromTov: 0, ptsFromStl: 0, ptsAllowedFromTov: 0
                };
            });
            const oppStats = { pts: 0, reb: 0, ast: 0, tov: 0, fouls: 0, fga: 0, fgm: 0, fta: 0, ftm: 0 };
            let home = 0, away = 0;

            actions.forEach(act => {
                const { type, playerId, consequence, onCourt } = act;
                
                // Points Update Logic
                let pointsScored = 0;
                let pointsConceded = 0;

                // --- OPPONENT ACTION ---
                if (playerId === 'OPP') {
                    if (type === "FGM1") { oppStats.pts += 1; oppStats.ftm += 1; oppStats.fta += 1; away += 1; pointsConceded = 1; }
                    if (type === "FGA1") { oppStats.fta += 1; }
                    if (type === "FGM2") { oppStats.pts += 2; oppStats.fgm += 1; oppStats.fga += 1; away += 2; pointsConceded = 2; }
                    if (type === "FGA2") { oppStats.fga += 1; }
                    if (type === "FGM3") { oppStats.pts += 3; oppStats.fgm += 1; oppStats.fga += 1; away += 3; pointsConceded = 3; }
                    if (type === "FGA3") { oppStats.fga += 1; }
                    if (type === "DREB" || type === "OREB") { oppStats.reb += 1; }
                    if (type === "AST") { oppStats.ast += 1; }
                    if (type === "TOV") { oppStats.tov += 1; }
                    if (type === "PF") { oppStats.fouls += 1; }
                    
                    // Conséquences (Positive for US)
                    if (consequence === "score_2") { home += 2; pointsScored = 2; }
                    if (consequence === "score_3") { home += 3; pointsScored = 3; }
                } 
                // --- PLAYER ACTION ---
                else if (pStats[playerId]) {
                    const ps = pStats[playerId];
                    if (type === "FGM1") { ps.pts += 1; ps.ftm += 1; ps.fta += 1; home += 1; pointsScored = 1; }
                    if (type === "FGA1") { ps.fta += 1; }
                    if (type === "FGM2") { ps.pts += 2; ps.fgm += 1; ps.fga += 1; home += 2; pointsScored = 2; }
                    if (type === "FGA2") { ps.fga += 1; }
                    if (type === "FGM3") { ps.pts += 3; ps.fgm += 1; ps.fga += 1; home += 3; pointsScored = 3; }
                    if (type === "FGA3") { ps.fga += 1; }
                    if (type === "OREB") { ps.reb += 1; ps.oreb += 1; }
                    if (type === "DREB") { ps.reb += 1; ps.dreb += 1; }
                    if (type === "AST") { ps.ast += 1; }
                    if (type === "STL") { ps.stl += 1; }
                    if (type === "BLK") { ps.blk += 1; }
                    if (type === "TOV") { ps.tov += 1; }
                    if (type === "PF") { ps.pf += 1; }

                    // Conséquences (Negative for US)
                    if (consequence === "score_2") { 
                        ps.pointsAllowed += 2; ps.ptsAllowedFromTov += 2; 
                        away += 2; pointsConceded = 2; 
                    }
                    if (consequence === "score_3") { 
                        ps.pointsAllowed += 3; ps.ptsAllowedFromTov += 3; 
                        away += 3; pointsConceded = 3; 
                    }
                    
                    // Special Tracking
                    if(type === "STL" && (consequence === "score_2" || consequence === "score_3")) {
                        // If player stole and we scored, credit them
                        const pts = consequence === "score_2" ? 2 : 3;
                        ps.ptsFromStl += pts;
                    }
                }

                // --- PLUS/MINUS CALCULATION ---
                // If onCourt data exists for this action, update +/-
                if (onCourt && Array.isArray(onCourt)) {
                    onCourt.forEach(pid => {
                        if (pStats[pid]) {
                            pStats[pid].plusMinus += pointsScored;
                            pStats[pid].plusMinus -= pointsConceded;
                        }
                    });
                }
            });

            return { playerStats: pStats, opponentStats: oppStats, homeScore: home, awayScore: away };
        };

        const LiveTracker = ({ players, onSaveGame, initialGame }) => {
            const [gameState, setGameState] = useState({
                quarter: 1, opponent: "Adversaire", location: "Domicile",
                actions: []
            });
            
            // TIMER & ON COURT
            const [gameTime, setGameTime] = useState(0); // in seconds
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [onCourt, setOnCourt] = useState([]); // Array of IDs
            const [accumulatedMinutes, setAccumulatedMinutes] = useState({}); // { playerId: seconds }

            const [derived, setDerived] = useState(recalculateStats([], players));
            
            const [modal, setModal] = useState({ type: null, data: null });
            const [showStats, setShowStats] = useState(false);
            const [showLog, setShowLog] = useState(false);

            // --- LOAD INITIAL GAME ---
            useEffect(() => {
                if (initialGame) {
                    setGameState({
                        quarter: initialGame.quarter || 1,
                        opponent: initialGame.opponent,
                        location: initialGame.location,
                        actions: initialGame.actions || []
                    });
                    // Note: Initial minutes handling is complex without full log replay of time, 
                    // so we assume editing is mostly for stats correction, not time replay.
                }
            }, [initialGame]);

            useEffect(() => {
                setDerived(recalculateStats(gameState.actions, players));
            }, [gameState.actions, players]);

            // --- TIMER LOGIC ---
            useEffect(() => {
                let interval;
                if (isTimerRunning) {
                    interval = setInterval(() => {
                        setGameTime(prev => prev + 1);
                        // Add seconds to players on court
                        setAccumulatedMinutes(prev => {
                            const next = { ...prev };
                            onCourt.forEach(id => {
                                next[id] = (next[id] || 0) + 1;
                            });
                            return next;
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, onCourt]);

            const togglePlayerOnCourt = (id) => {
                if (onCourt.includes(id)) {
                    setOnCourt(prev => prev.filter(pid => pid !== id));
                } else {
                    if (onCourt.length >= 5) {
                        alert("Déjà 5 joueurs sur le terrain ! Retirez-en un d'abord.");
                        return;
                    }
                    setOnCourt(prev => [...prev, id]);
                }
            };

            const formatTime = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            };

            // Add action
            const registerAction = (actionType, player, extraData = {}) => {
                const newAction = {
                    id: generateId(),
                    type: actionType,
                    playerId: player === 'opponent' ? 'OPP' : player.id,
                    playerName: player === 'opponent' ? 'Adversaire' : player.name,
                    q: gameState.quarter,
                    consequence: extraData.consequence,
                    timestamp: new Date().toLocaleTimeString(),
                    onCourt: [...onCourt] // Snapshot who is on court
                };
                setGameState(prev => ({ ...prev, actions: [...prev.actions, newAction] }));
                setModal({ type: null, data: null });
            };

            const removeAction = (actionId) => {
                if(confirm("Supprimer cette action ?")) {
                    setGameState(prev => ({ ...prev, actions: prev.actions.filter(a => a.id !== actionId) }));
                }
            };

            const handleFinishGame = () => {
                if (confirm("Terminer le match ?")) {
                    // Merge accumulated seconds into minutes
                    const finalStats = { ...derived.playerStats };
                    Object.keys(accumulatedMinutes).forEach(pid => {
                        if(finalStats[pid]) {
                            // If we edited a match with existing minutes, we add to them, otherwise overwrite
                            const existing = initialGame?.playerStats?.[pid]?.minutes || 0;
                            finalStats[pid].minutes = existing + Math.round(accumulatedMinutes[pid] / 60);
                        }
                    });

                    onSaveGame({
                        ...gameState,
                        homeScore: derived.homeScore,
                        awayScore: derived.awayScore,
                        playerStats: finalStats,
                        opponentStats: derived.opponentStats
                    });
                }
            };

            // Consequence Helpers
            const ConsequenceButtons = ({ onSelect }) => (
                <div className="flex flex-col gap-2">
                    <Button onClick={() => onSelect("score_2")} className="bg-red-600/80">Adversaire +2 Pts</Button>
                    <Button onClick={() => onSelect("score_3")} className="bg-red-600">Adversaire +3 Pts</Button>
                    <Button onClick={() => onSelect("foul")} className="bg-yellow-600">Faute Provoquée</Button>
                    <Button onClick={() => onSelect("foul_ft")} className="bg-yellow-700">Faute + Lancers</Button>
                    <Button onClick={() => onSelect("none")} className="bg-slate-600">Rien</Button>
                </div>
            );
            
            const PositiveConsequenceButtons = ({ onSelect }) => (
                <div className="flex flex-col gap-2">
                    <Button onClick={() => onSelect("score_2")} className="bg-green-600/80">Nous Marquons +2</Button>
                    <Button onClick={() => onSelect("score_3")} className="bg-green-600">Nous Marquons +3</Button>
                    <Button onClick={() => onSelect("foul")} className="bg-yellow-600">Faute sur Nous</Button>
                    <Button onClick={() => onSelect("none")} className="bg-slate-600">Rien</Button>
                </div>
            );

            const teamTotals = useMemo(() => {
                const totals = { pts: 0, reb: 0, ast: 0, pf: 0, stl: 0, tov: 0 };
                Object.values(derived.playerStats).forEach(s => {
                    totals.pts += s.pts; totals.reb += s.reb; totals.ast += s.ast;
                    totals.pf += s.pf; totals.stl += s.stl; totals.tov += s.tov;
                });
                return totals;
            }, [derived.playerStats]);

            return (
                <div className="flex flex-col h-full gap-4 relative">
                    {/* TIMER BAR */}
                    <div className="bg-slate-800 p-2 flex justify-between items-center rounded-lg border border-slate-700">
                        <div className="flex items-center gap-4">
                            <Button 
                                size="sm" 
                                className={isTimerRunning ? "bg-red-500 hover:bg-red-600" : "bg-green-500 hover:bg-green-600"}
                                onClick={() => setIsTimerRunning(!isTimerRunning)}
                            >
                                <Icon path={isTimerRunning ? Icons.Pause : Icons.Play} /> {isTimerRunning ? "Stop" : "Start"}
                            </Button>
                            <div className="font-mono text-xl text-white font-bold">{formatTime(gameTime)}</div>
                        </div>
                        <div className="text-xs text-slate-400">
                            Joueurs sur terrain: <span className={onCourt.length === 5 ? "text-green-400 font-bold" : "text-orange-400"}>{onCourt.length}/5</span>
                        </div>
                    </div>

                    {/* SCOREBOARD */}
                    <Card className="bg-slate-900 p-4 flex justify-between items-center sticky top-0 z-10 border-b-4 border-coach-accent">
                        <div className="text-4xl font-bold text-white">{derived.homeScore}</div>
                        <div className="flex flex-col items-center">
                            <div className="text-xl font-bold text-orange-500">Q{gameState.quarter}</div>
                            <div className="flex gap-2 mt-1">
                                <button onClick={() => setGameState(p=>({...p, quarter: Math.max(1, p.quarter-1)}))} className="text-xs text-slate-500 hover:text-white">-</button>
                                <button onClick={() => setGameState(p=>({...p, quarter: p.quarter+1}))} className="text-xs text-slate-500 hover:text-white">+</button>
                            </div>
                        </div>
                        <div className="text-center flex flex-col items-end">
                            <div className="text-4xl font-bold text-red-500">{derived.awayScore}</div>
                            <input className="text-xs text-slate-500 bg-transparent text-right focus:text-white w-32 outline-none" value={gameState.opponent} onChange={(e) => setGameState(prev => ({...prev, opponent: e.target.value}))} />
                        </div>
                    </Card>

                    {/* CONTROLS */}
                    <div className="flex gap-2 justify-center">
                        <Button size="sm" variant="secondary" onClick={() => setShowStats(true)}><Icon path={Icons.Eye} /> Stats</Button>
                        <Button size="sm" variant="secondary" onClick={() => setShowLog(true)}><Icon path={Icons.List} /> Journal ({gameState.actions.length})</Button>
                    </div>

                    {/* PLAYERS GRID */}
                    <div className="flex-1 overflow-y-auto grid grid-cols-2 md:grid-cols-4 gap-3 pb-20">
                        {players.map(player => {
                            const pStats = derived.playerStats[player.id] || { pts: 0, pf: 0, plusMinus: 0 };
                            const isOnCourt = onCourt.includes(player.id);
                            const currentSeconds = accumulatedMinutes[player.id] || 0;
                            
                            return (
                                <div key={player.id} className={`relative p-3 rounded-xl border shadow-md transition-all ${isOnCourt ? 'bg-slate-800 border-orange-500 ring-1 ring-orange-500/50' : 'bg-slate-800/60 border-slate-700 opacity-80'}`}>
                                    {/* Selection Overlay for Subs */}
                                    <div className="absolute top-2 right-2 z-20">
                                        <input 
                                            type="checkbox" 
                                            checked={isOnCourt} 
                                            onChange={() => togglePlayerOnCourt(player.id)}
                                            className="w-5 h-5 accent-orange-500 cursor-pointer"
                                        />
                                    </div>

                                    {/* Click Area for Actions */}
                                    <div onClick={() => setModal({ type: "ACTION_MENU", data: player })} className="cursor-pointer">
                                        <div className="flex justify-between pr-6">
                                            <span className={`font-bold truncate ${isOnCourt ? 'text-white' : 'text-slate-400'}`}>{player.name}</span>
                                            <span className="text-xs text-slate-500">#{player.number}</span>
                                        </div>
                                        <div className="text-xs mt-2 flex justify-between items-end">
                                            <div className="space-x-2 text-slate-300">
                                                <span>Pts: <b className="text-white">{pStats.pts}</b></span>
                                                <span>+/-: <b className={pStats.plusMinus >= 0 ? "text-green-400" : "text-red-400"}>{pStats.plusMinus > 0 ? '+' : ''}{pStats.plusMinus}</b></span>
                                            </div>
                                            <div className="font-mono text-[10px] text-slate-500">
                                                {Math.floor(currentSeconds / 60)}'
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                        <div onClick={() => setModal({ type: "ACTION_MENU", data: "opponent" })} className="bg-red-900/40 p-3 rounded-xl border border-red-700 shadow-md hover:border-red-500 cursor-pointer flex flex-col items-center justify-center text-center">
                            <span className="font-bold text-red-200">{gameState.opponent.toUpperCase()}</span>
                            <div className="text-xs mt-1 text-red-300">Fautes: {derived.opponentStats.fouls}</div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 bg-slate-900 p-4 border-t border-slate-800 flex justify-end z-20">
                        <Button variant="success" onClick={handleFinishGame}><Icon path={Icons.Check} /> Finir</Button>
                    </div>

                    {/* --- MODALS --- */}
                    <Modal isOpen={modal.type === "ACTION_MENU"} onClose={() => setModal({type:null})} title={modal.data === 'opponent' ? "Actions Adversaire" : modal.data?.name}>
                        <div className="grid grid-cols-3 gap-3">
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM2", modal.data)}>+2 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM3", modal.data)}>+3 Pts</Button>
                            <Button className="bg-green-600 h-12" onClick={() => registerAction("FGM1", modal.data)}>+1 LF</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA2", modal.data)}>Miss 2</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA3", modal.data)}>Miss 3</Button>
                            <Button className="bg-red-500 h-10" onClick={() => registerAction("FGA1", modal.data)}>Miss LF</Button>
                            <div className="col-span-3 h-px bg-slate-600 my-1"></div>
                            <Button className="bg-blue-600" onClick={() => registerAction("DREB", modal.data)}>Reb D</Button>
                            <Button className="bg-blue-500" onClick={() => registerAction("OREB", modal.data)}>Reb O</Button>
                            <Button className="bg-purple-600" onClick={() => registerAction("AST", modal.data)}>Passe</Button>
                            <Button className="bg-yellow-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_STL", data: modal.data}) : setModal({type: "CONSEQ_OPP_STL", data: modal.data})}>Int</Button>
                            <Button className="bg-orange-600" onClick={() => modal.data !== 'opponent' ? setModal({type: "CONSEQ_TOV", data: modal.data}) : setModal({type: "CONSEQ_OPP_TOV", data: modal.data})}>Balle P.</Button>
                            <Button className="bg-slate-600" onClick={() => registerAction("BLK", modal.data)}>Contre</Button>
                            <Button variant="danger" className="col-span-3 mt-2" onClick={() => registerAction("PF", modal.data)}>Faute Perso</Button>
                        </div>
                    </Modal>

                    <Modal isOpen={modal.type === "CONSEQ_TOV"} onClose={() => setModal({type:null})} title="Conséquence Balle Perdue ?">
                        <ConsequenceButtons onSelect={(c) => registerAction("TOV", modal.data, { consequence: c })} />
                    </Modal>
                    <Modal isOpen={modal.type === "CONSEQ_STL"} onClose={() => setModal({type:null})} title="Suite à l'Interception ?">
                         <PositiveConsequenceButtons onSelect={(c) => registerAction("STL", modal.data, { consequence: c })} />
                    </Modal>
                    <Modal isOpen={modal.type === "CONSEQ_OPP_TOV"} onClose={() => setModal({type:null})} title="Conséquence Perte Adv. ?">
                        <PositiveConsequenceButtons onSelect={(c) => registerAction("TOV", "opponent", { consequence: c })} />
                    </Modal>
                    <Modal isOpen={modal.type === "CONSEQ_OPP_STL"} onClose={() => setModal({type:null})} title="Suite Interception Adv. ?">
                         <ConsequenceButtons onSelect={(c) => registerAction("STL", "opponent", { consequence: c })} />
                    </Modal>

                    <Modal isOpen={showStats} onClose={() => setShowStats(false)} title="Statistiques Détaillées">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-xs text-slate-300">
                                <thead className="bg-slate-700 text-white uppercase">
                                    <tr>
                                        <th className="p-2">J</th>
                                        <th className="p-2">Pts</th>
                                        <th className="p-2">+/-</th>
                                        <th className="p-2 text-orange-400" title="Points générés suite interception">Pts/Int</th>
                                        <th className="p-2 text-red-400" title="Points encaissés suite perte de balle">Enc/TOV</th>
                                        <th className="p-2">Reb</th>
                                        <th className="p-2">Ast</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
                                    {players.map(p => {
                                        const s = derived.playerStats[p.id] || { pts: 0, plusMinus: 0, ptsFromStl: 0, ptsAllowedFromTov: 0, reb: 0, ast: 0 };
                                        return (
                                            <tr key={p.id}>
                                                <td className="p-2 font-bold">{p.name}</td>
                                                <td className="p-2">{s.pts}</td>
                                                <td className={`p-2 font-bold ${s.plusMinus >= 0 ? 'text-green-400' : 'text-red-400'}`}>{s.plusMinus > 0 ? '+' : ''}{s.plusMinus}</td>
                                                <td className="p-2 text-orange-300">{s.ptsFromStl}</td>
                                                <td className="p-2 text-red-300">{s.ptsAllowedFromTov}</td>
                                                <td className="p-2">{s.reb}</td>
                                                <td className="p-2">{s.ast}</td>
                                            </tr>
                                        );
                                    })}
                                    <tr className="bg-slate-800 border-t-2 border-slate-600 font-bold text-white">
                                        <td className="p-2">TOTAL</td>
                                        <td className="p-2">{teamTotals.pts}</td>
                                        <td className="p-2">-</td>
                                        <td className="p-2">-</td>
                                        <td className="p-2">-</td>
                                        <td className="p-2">{teamTotals.reb}</td>
                                        <td className="p-2">{teamTotals.ast}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </Modal>

                    <Modal isOpen={showLog} onClose={() => setShowLog(false)} title="Journal">
                        <div className="space-y-2">
                            {gameState.actions.slice().reverse().map(act => (
                                <div key={act.id} className="bg-slate-800 p-2 rounded flex justify-between items-center text-sm border border-slate-700">
                                    <div>
                                        <span className="text-orange-400 font-bold mr-2">Q{act.q}</span>
                                        <span className="text-white font-bold">{act.playerName}</span>
                                        <span className="text-slate-400 mx-1">-</span>
                                        <span className="text-slate-300">{act.type}</span>
                                        {act.consequence && <span className="text-xs text-red-400 ml-2">({act.consequence})</span>}
                                    </div>
                                    <button onClick={() => removeAction(act.id)} className="text-red-500 px-2">X</button>
                                </div>
                            ))}
                        </div>
                    </Modal>
                </div>
            );
        };

        const CoachAssistant = ({ aggregatedStats, apiKey }) => {
            const [messages, setMessages] = useState([{ role: 'system', content: "Je suis ton Assistant Coach IA." }]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const scrollRef = useRef(null);

            useEffect(() => { if(scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages]);

            const handleSend = async () => {
                if (!apiKey) { alert("Clé API manquante !"); return; }
                setMessages(prev => [...prev, { role: 'user', content: input }]);
                setLoading(true);
                try {
                    const context = `Stats: ${JSON.stringify(aggregatedStats)}. Question: ${input}`;
                    const reply = await callGemini(context, apiKey);
                    setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
                } catch (e) { setMessages(prev => [...prev, { role: 'system', content: "Erreur API." }]); }
                setLoading(false); setInput("");
            };

            return (
                <div className="flex flex-col h-[500px] bg-slate-900 rounded-xl border border-slate-700">
                    <div className="p-3 bg-slate-800 font-bold text-white border-b border-slate-700">Chat IA</div>
                    <div className="flex-1 overflow-y-auto p-3 space-y-2" ref={scrollRef}>
                        {messages.map((m, i) => (
                            <div key={i} className={`p-2 rounded ${m.role === 'user' ? 'bg-orange-600 ml-auto text-white' : 'bg-slate-800 text-slate-200'}`}>{m.content}</div>
                        ))}
                        {loading && <div className="text-slate-500">...</div>}
                    </div>
                    <div className="p-3 border-t border-slate-700 flex gap-2">
                        <input className="flex-1 bg-slate-800 rounded px-2 text-white" value={input} onChange={e => setInput(e.target.value)} />
                        <Button onClick={handleSend}>Envoyer</Button>
                    </div>
                </div>
            );
        };

        // --- COACH OS & SMART RATING ---
        const CoachOS = ({ players, games, apiKey }) => {
            const [activeTab, setActiveTab] = useState("reco");
            const [simLineup, setSimLineup] = useState([null,null,null,null,null]);

            const aggregatedStats = useMemo(() => {
                const stats = {};
                players.forEach(p => stats[p.id] = { ...p, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, tov: 0, fga: 0, fgm: 0, fta: 0, ftm: 0, pf: 0, plusMinus: 0 });
                games.forEach(g => {
                    Object.entries(g.playerStats).forEach(([pid, ps]) => {
                        if (stats[pid]) {
                            stats[pid].gp++; 
                            stats[pid].min += (ps.minutes||0); 
                            stats[pid].pts += ps.pts; stats[pid].reb += ps.reb; stats[pid].ast += ps.ast; 
                            stats[pid].tov += ps.tov; stats[pid].fga += ps.fga; stats[pid].fgm += ps.fgm;
                            stats[pid].plusMinus += (ps.plusMinus || 0);
                        }
                    });
                });
                return Object.values(stats).map(s => ({ ...s, ...calculateAdvancedStats(s, s.min) }));
            }, [games, players]);

            const renderSmartRating = () => {
                // --- ALGORITHME DE PONDÉRATION AVANCÉE (Bayesien) ---
                const avgEfficiency = aggregatedStats.reduce((acc, p) => acc + p.effPerMin, 0) / (aggregatedStats.length || 1);
                
                const ratedPlayers = aggregatedStats.map(p => {
                    const min = p.min;
                    // Facteur de confiance (Sigmoid): Atteint ~90% de confiance à 20 mins de jeu total
                    const confidence = 1 / (1 + Math.exp(-0.2 * (min - 10))); 
                    
                    // Lissage Bayesien : On mixe la performance réelle avec la moyenne de l'équipe
                    // Si peu de minutes, on tire le joueur vers la moyenne pour éviter les extrêmes
                    const adjustedEff = (p.effPerMin * confidence) + (avgEfficiency * (1 - confidence));
                    
                    // Score final sur 100 (arbitraire pour classement)
                    // Bonus pour le Plus/Minus
                    const rating = (adjustedEff * 40) + (p.plusMinus * 0.2); 

                    return { ...p, confidence, rating, adjustedEff };
                }).sort((a, b) => b.rating - a.rating);

                const top5 = ratedPlayers.slice(0, 5);

                return (
                    <div className="space-y-4 animate-fade-in">
                        <Card className="p-6 bg-gradient-to-br from-slate-900 to-slate-800 border-l-4 border-indigo-500">
                            <h3 className="text-xl font-bold text-white mb-2"><Icon path={Icons.Robot} /> Smart Rating (Pondéré)</h3>
                            <p className="text-sm text-slate-400 mb-4">
                                Ce classement utilise un <strong>lissage statistique</strong>. Pour les joueurs à faible temps de jeu, 
                                leur performance est pondérée par la moyenne de l'équipe (Confiance faible) pour éviter les 
                                "flukes" (statistiques aberrantes sur 2 minutes). Le rating inclut aussi le Plus/Minus.
                            </p>
                            <div className="space-y-2">
                                {top5.map((p, i) => (
                                    <div key={p.id} className="flex justify-between items-center bg-slate-800/50 p-2 rounded border border-slate-700">
                                        <div className="flex items-center gap-3">
                                            <div className="w-6 h-6 rounded-full bg-indigo-600 flex items-center justify-center text-xs font-bold">{i+1}</div>
                                            <div>
                                                <div className="font-bold text-white">{p.name}</div>
                                                <div className="text-[10px] text-slate-400">Confiance: {Math.round(p.confidence * 100)}%</div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-lg font-bold text-indigo-400">{p.rating.toFixed(1)}</div>
                                            <div className="text-[10px] text-slate-500">Rating</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </Card>
                        
                        <div className="overflow-x-auto bg-slate-900 rounded-lg p-2">
                            <table className="w-full text-left text-xs text-slate-300">
                                <thead className="text-slate-500 uppercase">
                                    <tr>
                                        <th className="p-2">Joueur</th>
                                        <th className="p-2">Min</th>
                                        <th className="p-2">EFF/min</th>
                                        <th className="p-2">Confiance</th>
                                        <th className="p-2 text-indigo-400">Rating</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {ratedPlayers.map(p => (
                                        <tr key={p.id} className="border-b border-slate-800">
                                            <td className="p-2 font-bold">{p.name}</td>
                                            <td className="p-2">{p.min}</td>
                                            <td className="p-2">{p.effPerMin.toFixed(2)}</td>
                                            <td className="p-2">
                                                <div className="w-12 h-1 bg-slate-700 rounded">
                                                    <div className="h-full bg-indigo-500 rounded" style={{width: `${p.confidence*100}%`}}></div>
                                                </div>
                                            </td>
                                            <td className="p-2 font-bold text-indigo-400">{p.rating.toFixed(1)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="flex flex-col h-full">
                    <div className="flex gap-1 border-b border-slate-700 mb-4 overflow-x-auto no-scrollbar">
                        <button onClick={() => setActiveTab("reco")} className={`px-4 py-2 ${activeTab==='reco'?'text-orange-500 border-b-2 border-orange-500':''}`}>Smart Rating</button>
                        <button onClick={() => setActiveTab("chat")} className={`px-4 py-2 ${activeTab==='chat'?'text-orange-500 border-b-2 border-orange-500':''}`}>Assistant IA</button>
                    </div>
                    <div className="flex-1 overflow-y-auto pb-20">
                        {activeTab === 'reco' && renderSmartRating()}
                        {activeTab === 'chat' && <CoachAssistant aggregatedStats={aggregatedStats} apiKey={apiKey} />}
                    </div>
                </div>
            );
        };

        const Settings = ({ players, onUpdatePlayers, apiKey, setApiKey }) => {
            const addPlayer = () => {
                const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
                onUpdatePlayers([...players, { id: newId, name: "Nouveau", number: 0, pos: "G" }]);
            };
            return (
                <div className="space-y-4">
                    <Card className="p-4 border-l-4 border-purple-500">
                        <div className="font-bold text-white mb-2">API Gemini</div>
                        <input type="password" className="w-full bg-slate-900 rounded p-2 text-white" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="Clé API..." />
                    </Card>
                    <div className="flex justify-between">
                        <h2 className="text-white text-xl">Effectif</h2>
                        <Button onClick={addPlayer} size="sm">Ajouter</Button>
                    </div>
                    <div className="grid gap-2">
                        {players.map((p, i) => (
                            <div key={p.id} className="bg-slate-800 p-2 rounded flex gap-2">
                                <input className="bg-transparent text-white w-8" value={p.number} onChange={e => {const n=[...players]; n[i].number=parseInt(e.target.value); onUpdatePlayers(n)}} />
                                <input className="bg-transparent text-white flex-1" value={p.name} onChange={e => {const n=[...players]; n[i].name=e.target.value; onUpdatePlayers(n)}} />
                                <button onClick={() => onUpdatePlayers(players.filter(x => x.id !== p.id))} className="text-red-500">X</button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const History = ({ games, setGames, apiKey, onEditGame }) => {
            const [viewDetail, setViewDetail] = useState(null);
            return (
                <div className="space-y-4">
                    {games.map(g => (
                        <Card key={g.id} className="p-4">
                            <div className="flex justify-between items-center mb-2">
                                <div className="text-white font-bold">{g.date} vs {g.opponent}</div>
                                <div className="text-xl"><span className="text-green-400">{g.homeScore}</span> - <span className="text-red-400">{g.awayScore}</span></div>
                            </div>
                            <div className="flex gap-2">
                                <Button size="sm" variant="secondary" onClick={() => setViewDetail(g)}>Détails</Button>
                                <Button size="sm" variant="secondary" onClick={() => onEditGame(g)}>Modifier</Button>
                                <Button size="sm" variant="danger" onClick={() => confirm("Supp?") && setGames(games.filter(x => x.id !== g.id))}>Supp</Button>
                            </div>
                        </Card>
                    ))}
                    <Modal isOpen={!!viewDetail} onClose={() => setViewDetail(null)} title="Détails Match">
                        {viewDetail && (
                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-slate-300 text-left">
                                    <thead className="bg-slate-700 text-white"><tr><th className="p-2">J</th><th className="p-2">Min</th><th className="p-2">Pts</th><th className="p-2">+/-</th></tr></thead>
                                    <tbody>
                                        {Object.entries(viewDetail.playerStats).map(([pid, s]) => (
                                            <tr key={pid}>
                                                <td className="p-2">ID {pid}</td>
                                                <td className="p-2">{s.minutes}</td>
                                                <td className="p-2">{s.pts}</td>
                                                <td className="p-2">{s.plusMinus}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </Modal>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState("live");
            const [players, setPlayers] = useState([]);
            const [games, setGames] = useState([]);
            const [apiKey, setApiKey] = useState("");
            const [activeGame, setActiveGame] = useState(null);

            useEffect(() => {
                setPlayers(JSON.parse(localStorage.getItem('basket_players')) || defaultPlayers);
                setGames(JSON.parse(localStorage.getItem('basket_games')) || []);
                setApiKey(localStorage.getItem('gemini_api_key') || "");
            }, []);

            useEffect(() => { localStorage.setItem('basket_players', JSON.stringify(players)); }, [players]);
            useEffect(() => { localStorage.setItem('basket_games', JSON.stringify(games)); }, [games]);
            useEffect(() => { localStorage.setItem('gemini_api_key', apiKey); }, [apiKey]);

            const handleSaveGame = (gameState) => {
                const gameId = activeGame?.id || generateId();
                const newGame = { ...gameState, id: gameId, date: activeGame?.date || new Date().toLocaleDateString() };
                setGames(prev => {
                    const exists = prev.find(g => g.id === gameId);
                    return exists ? prev.map(g => g.id === gameId ? newGame : g) : [newGame, ...prev];
                });
                setActiveGame(null);
                setView('history');
            };

            return (
                <div className="max-w-5xl mx-auto h-screen bg-slate-950 flex flex-col md:flex-row overflow-hidden font-sans text-slate-200">
                    <nav className="bg-slate-900 border-r border-slate-800 w-full md:w-20 flex md:flex-col items-center justify-evenly md:justify-start md:pt-6 p-2 z-50 shadow-xl shrink-0">
                        <div className="mb-0 md:mb-8 p-2 bg-orange-600 rounded-xl text-white font-black text-xl">BP</div>
                        {[
                            { id: "live", icon: Icons.Play },
                            { id: "intelligent", icon: Icons.Activity },
                            { id: "history", icon: Icons.Clipboard },
                            { id: "settings", icon: Icons.Settings }
                        ].map(btn => (
                            <button key={btn.id} onClick={() => setView(btn.id)} className={`p-3 rounded-xl transition-all ${view === btn.id ? 'bg-slate-700 text-white shadow-lg' : 'text-slate-500 hover:text-slate-300'}`}>
                                <Icon path={btn.icon} />
                            </button>
                        ))}
                    </nav>
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="h-16 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex items-center px-6 shrink-0">
                            <h1 className="font-bold text-lg text-white flex items-center gap-2">
                                {view === 'live' && (activeGame ? "✏️ Modifier Match" : "🔴 Match en Direct")}
                                {view === 'intelligent' && "🧠 Coach OS"}
                                {view === 'history' && "📜 Historique"}
                                {view === 'settings' && "⚙️ Paramètres"}
                            </h1>
                        </header>
                        <div className="flex-1 p-4 overflow-y-auto bg-slate-950 no-scrollbar">
                            {view === 'live' && <LiveTracker players={players} onSaveGame={handleSaveGame} initialGame={activeGame} />}
                            {view === 'intelligent' && <CoachOS players={players} games={games} apiKey={apiKey} />}
                            {view === 'history' && <History games={games} setGames={setGames} apiKey={apiKey} onEditGame={(g) => { setActiveGame(g); setView('live'); }} />}
                            {view === 'settings' && <Settings players={players} onUpdatePlayers={setPlayers} apiKey={apiKey} setApiKey={setApiKey} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
