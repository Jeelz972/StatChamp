<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stat Champagne Basket U18 Elite 2025-2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="design-tokens.css" />
    <link rel="stylesheet" href="app.css" />

    <script src="https://cdn.tailwindcss.com"></script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace'],
            },
            colors: {
              slate: {
                50:  '#F4F4F6',
                100: '#E2E2EA',
                200: '#C4C4D4',
                300: '#94A3B8',
                400: '#6B7280',
                500: '#475569',
                600: '#334155',
                700: '#222234',
                800: '#1A1A2A',
                900: '#0D0D18',
                950: '#060609',
              },
              orange: {
                50:  '#FFF7ED',
                100: '#FFEDD5',
                200: '#FED7AA',
                300: '#FDBA74',
                400: '#FB923C',
                500: '#F97316',
                600: '#EA580C',
                700: '#C2410C',
                800: '#9A3412',
                900: '#7C2D12',
                950: '#431407',
              },
              indigo: {
                300: '#A5B4FC',
                400: '#818CF8',
                500: '#6366F1',
                600: '#4F46E5',
                700: '#4338CA',
              },
              'court-orange': '#F97316',
              'coach-dark':   '#0D0D18',
              'coach-accent': '#F97316',
            },
          },
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      (async function loadApp() {
        const loadJS = async (file, useBabel = false) => {
          const resp = await fetch(file);
          if (!resp.ok) throw new Error(`${file}: ${resp.status}`);
          let code = await resp.text();
          if (useBabel) code = Babel.transform(code, { presets: ['react'] }).code;
          const s = document.createElement('script');
          s.textContent = code;
          document.body.appendChild(s);
        };
        try {
          await loadJS('stat-engine.js', false);
          await loadJS('PlayByPlayEditor.js', true);
          await loadJS('ShotChart.js', true);
          await loadJS('AssistNetwork.js', true);
          await loadJS('nba-profiles.js', true);
          await loadJS('ReportPlayer.js', true);
          await loadJS('RotationChart.js', true);
          await loadJS('GlobalStats.js', true);
          await loadJS('SeasonDashboard.js', true);
          await loadJS('OpponentScouting.js', true);
          await loadJS('GamePrep.js', true);
          await loadJS('db-layer.js', false);
          await loadJS('app.js', true);
        } catch (err) {
          console.error('Erreur chargement:', err);
          document.getElementById('root').innerHTML =
            '<div style="color:red;padding:20px;">Erreur: ' + err.message + '</div>';
        }
      })();
    </script>
  </body>
</html>
