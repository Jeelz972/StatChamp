<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏀 Live Tracker V7.0 - Champagne Basket</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
:root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: #1a1a24;
    --bg-elevated: #222230;
    --accent: #f97316;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #eab308;
    --info: #3b82f6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border: #2d2d3a;
    --home-color: #3b82f6;
    --away-color: #ef4444;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body { 
    font-family: 'Inter', system-ui, sans-serif; 
    background: var(--bg-primary); 
    color: var(--text-primary); 
    height: 100dvh; 
    width: 100vw; 
    overflow: hidden;
}

#app-container { width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
#app { flex: 1; display: flex; flex-direction: column; min-height: 0; max-height: 100%; overflow: hidden; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes slide-up { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes pulse-reb { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

.loading-screen { position: fixed; inset: 0; background: var(--bg-primary); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
.loading-screen.hidden { display: none; }
.spinner { width: 50px; height: 50px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }

.scoreboard { flex-shrink: 0; height: 65px; background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary)); border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 15px; z-index: 100; }
.team-info { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.8rem; }
.team-info.away { flex-direction: row-reverse; text-align: right; }
.badge { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; }
.badge.home { background: var(--home-color); }
.badge.away { background: var(--away-color); }
.score-center { text-align: center; }
.score-display { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 800; display: flex; gap: 10px; justify-content: center; }
.score.home { color: var(--home-color); }
.score.away { color: var(--away-color); }
.game-meta { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 2px; }
.q-badge { background: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: 700; cursor: pointer; }
.timer { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 700; color: var(--warning); cursor: pointer; }
.timer.running { color: var(--success); animation: pulse 1s infinite; }
.timer-adj { cursor: pointer; font-size: 0.6rem; color: var(--text-muted); padding: 2px 4px; border-radius: 3px; }
.timer-adj:hover { background: var(--bg-elevated); color: var(--accent); }
.poss-arrow { cursor: pointer; font-size: 0.9rem; margin: 0 4px; transition: transform 0.2s; }

.tabs { display: flex; height: 40px; background: var(--bg-secondary); border-bottom: 1px solid var(--border); flex-shrink: 0; z-index: 100; }
.tab-btn { flex: 1; background: none; border: none; color: var(--text-secondary); font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; font-size: 0.75rem; }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg-card); }

.view { display: none; height: 100%; width: 100%; overflow: hidden; }
#view-live.active { display: flex; flex-direction: column; flex: 1; min-height: 0; max-height: 100%; }

.oncourt-bar { flex-shrink: 0; height: 32px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.65rem; grid-area: oncourt; flex-wrap: wrap; padding: 4px 8px; }
.oc-team { display: flex; gap: 4px; }
.oc-dot { padding: 2px 6px; border-radius: 4px; background: var(--bg-elevated); border: 1px solid var(--border); font-weight: 700; font-size: 0.55rem; }
.oc-dot.home { border-color: var(--home-color); }
.oc-dot.away { border-color: var(--away-color); }
.oc-dot.starter { background: rgba(249, 115, 22, 0.3); border-color: var(--accent); }
.filter-select { background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 0.55rem; }

.roster-container { display: flex; flex-direction: column; }
.roster-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; background: var(--bg-card); border-bottom: 1px solid var(--border); }
.roster-header.away { border-top: 1px solid var(--border); border-bottom: none; }
.roster-title { font-size: 0.6rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.btn-reset { padding: 4px 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; color: var(--text-secondary); font-size: 0.55rem; font-weight: 600; cursor: pointer; }
.btn-reset:hover { border-color: var(--accent); color: var(--accent); }

.roster-home, .roster-away { flex-shrink: 0; background: var(--bg-secondary); padding: 6px 8px; display: flex; gap: 6px; overflow-x: auto; }

.p-card { flex-shrink: 0; width: 52px; height: 52px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: all 0.15s; }
.p-card.active { border-color: var(--accent); background: rgba(249, 115, 22, 0.2); transform: scale(1.05); }
.p-card.oncourt { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
.p-card.oncourt.active { border-color: var(--accent); background: rgba(249, 115, 22, 0.2); }
.p-card.starter::after { content: '★'; position: absolute; top: -4px; left: -4px; font-size: 0.6rem; color: var(--accent); }

.roster-away .p-card { border-color: rgba(239, 68, 68, 0.4); }
.roster-away .p-card.oncourt { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
.roster-away .p-card.active { border-color: var(--info); background: rgba(59, 130, 246, 0.2); transform: scale(1.05); }

.p-num { font-size: 0.95rem; font-weight: 800; }
.roster-away .p-num { color: var(--away-color); }
.p-name { font-size: 0.45rem; color: var(--text-secondary); max-width: 48px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-pts { position: absolute; top: 2px; right: 3px; font-size: 0.55rem; color: var(--accent); font-weight: 700; }
.p-fls { position: absolute; bottom: 2px; display: flex; gap: 1px; }
.f SEQ-dot { width: 4px; height: 4px; background: var(--danger); border-radius: 50%; }

.court-wrapper { flex: 1; min-height: 0; max-height: 100%; position: relative; background: #151515; display: flex; align-items: center; justify-content: center; overflow: hidden; grid-area: court; }
canvas { max-width: 100%; max-height: 100%; cursor: crosshair; object-fit: contain; }
.overlay-msg { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; opacity: 0; transition: 0.2s; z-index: 50; pointer-events: none; }
.overlay-msg.show { opacity: 1; }
.shot-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 12px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 100; }
.shot-popup.active { opacity: 1; pointer-events: auto; }
.btn-shot { padding: 14px 28px; border-radius: 12px; border: none; font-weight: 800; font-size: 0.9rem; color: white; cursor: pointer; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
.btn-shot.made { background: var(--success); }
.btn-shot.miss { background: var(--danger); }

.actions-bar { flex-shrink: 0; width: 100%; background: var(--bg-elevated); padding: 8px; border-top: 1px solid var(--border); z-index: 50; grid-area: actions; }
.actions-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.btn-act { height: 44px; border: none; border-radius: 8px; color: white; font-weight: 700; font-size: 0.55rem; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; }
.btn-act:active { transform: scale(0.95); }
.btn-act .icon { font-size: 1rem; }
.btn-act .shortcut { position: absolute; top: 2px; right: 4px; font-size: 0.5rem; background: rgba(0,0,0,0.4); padding: 1px 3px; border-radius: 3px; }
.btn-act.highlight-reb { animation: pulse-reb 0.8s infinite; box-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }
.c-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
.c-green { background: linear-gradient(135deg, #10b981, #059669); }
.c-orange { background: linear-gradient(135deg, #f97316, #c2410c); }
.c-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
.c-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
.c-gray { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-secondary); }
.c-yellow { background: linear-gradient(135deg, #eab308, #ca8a04); }
.c-cyan { background: linear-gradient(135deg, #06b6d4, #0891b2); }
.span-2 { grid-column: span 2; }

.assist-overlay { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 2px solid var(--success); border-radius: 12px; padding: 12px; z-index: 200; display: none; gap: 8px; align-items: center; animation: slide-up 0.3s; }
.assist-overlay .assist-btn { width: 50px; height: 50px; border-radius: 8px; border: 2px solid var(--border); background: var(--bg-card); color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.assist-overlay .assist-btn:hover { border-color: var(--success); }
.assist-overlay .assist-btn .num { font-weight: 800; font-size: 1rem; }
.assist-overlay .assist-btn .name { font-size: 0.5rem; color: var(--text-muted); }
.assist-overlay .no-assist { padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: 0.7rem; }

.insert-btn { font-size: 0.6rem; padding: 4px 8px; opacity: 0.4; transition: opacity 0.2s; }
.insert-btn:hover { opacity: 1; }

@media (min-width: 1024px) {
    .scoreboard { height: 70px; padding: 0 30px; }
    .score-display { font-size: 2.2rem; }
    .badge { width: 44px; height: 44px; font-size: 0.7rem; }
    #view-live.active { display: grid; grid-template-columns: 140px 1fr 140px; grid-template-rows: 38px 1fr 90px; grid-template-areas: "oncourt oncourt oncourt" "rosterH court rosterA" "actions actions actions"; height: 100%; max-height: 100%; overflow: hidden; }
    .oncourt-bar { height: 38px; min-height: 38px; font-size: 0.75rem; }
    .roster-container.home { grid-area: rosterH; display: flex; flex-direction: column; border-right: 1px solid var(--border); overflow: hidden; }
    .roster-container.away { grid-area: rosterA; display: flex; flex-direction: column; border-left: 1px solid var(--border); overflow: hidden; }
    .roster-header { padding: 6px 10px; }
    .roster-header.away { border-top: none; }
    .roster-home { flex-direction: column; overflow-y: auto; overflow-x: hidden; padding: 10px; min-height: 0; flex: 1; border-bottom: none; }
    .roster-away { flex-direction: column; overflow-y: auto; overflow-x: hidden; padding: 10px; min-height: 0; flex: 1; border-top: none; }
    .roster-home .p-card, .roster-away .p-card { width: 100%; height: 60px; margin-bottom: 4px; flex-shrink: 0; }
    .p-num { font-size: 1.1rem; }
    .p-name { font-size: 0.6rem; max-width: 100px; }
    .court-wrapper { min-height: 0; overflow: hidden; }
    .actions-bar { height: 90px; min-height: 90px; max-height: 90px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .actions-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .btn-act { width: 80px; height: 40px; flex-direction: row; font-size: 0.65rem; gap: 4px; }
    .btn-act.span-2 { width: 100px; }
}

#view-stats.active, #view-pbp.active { display: flex; flex-direction: column; }
.table-wrap { padding: 12px; overflow-y: auto; flex: 1; }
.stats-section { margin-bottom: 20px; }
.stats-section h3 { font-size: 0.85rem; color: var(--accent); margin-bottom: 10px; padding: 8px; background: var(--bg-secondary); border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.65rem; }
th { background: var(--bg-secondary); padding: 8px 4px; text-align: center; position: sticky; top: 0; z-index: 10; font-size: 0.6rem; }
td { border-bottom: 1px solid var(--border); padding: 6px 4px; text-align: center; }
.starter-badge { display: inline-block; width: 8px; height: 8px; background: var(--accent); border-radius: 50%; margin-left: 4px; }

.log-row { display: flex; gap: 10px; padding: 12px; margin-bottom: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; font-size: 0.8rem; align-items: center; cursor: pointer; }
.log-row:hover { border-color: var(--accent); background: var(--bg-elevated); }
.log-row.home { border-left: 4px solid var(--home-color); }
.log-row.away { border-left: 4px solid var(--away-color); }

.modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-wrap.show { display: flex; }
.modal { background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 14px; border: 1px solid var(--border); overflow: hidden; max-height: 85vh; display: flex; flex-direction: column; }
.modal-head { padding: 14px; background: var(--bg-secondary); text-align: center; font-weight: 700; border-bottom: 1px solid var(--border); font-size: 1rem; }
.modal-body { padding: 16px; overflow-y: auto; flex: 1; }
.modal-grid { display: grid; gap: 8px; padding: 0 16px 16px; }
.g-1 { grid-template-columns: 1fr; }
.g-2 { grid-template-columns: 1fr 1fr; }
.g-3 { grid-template-columns: 1fr 1fr 1fr; }
.g-4 { grid-template-columns: repeat(4, 1fr); }
.g-5 { grid-template-columns: repeat(5, 1fr); }
.btn-mod { padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-elevated); color: white; font-weight: 700; cursor: pointer; font-size: 0.85rem; }
.btn-mod.prim { background: var(--info); border: none; }
.btn-mod.danger { background: var(--danger); border: none; }
.btn-mod.success { background: var(--success); border: none; }
.btn-mod.small { padding: 8px; font-size: 0.75rem; }

.player-select-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 300px; overflow-y: auto; }
.player-select-btn { padding: 12px 8px; background: var(--bg-elevated); border: 2px solid var(--border); border-radius: 8px; color: white; cursor: pointer; text-align: center; }
.player-select-btn:hover { border-color: var(--accent); }
.player-select-btn.selected { border-color: var(--success); background: rgba(34, 197, 94, 0.2); }
.player-select-btn.home { border-color: rgba(59, 130, 246, 0.5); }
.player-select-btn.away { border-color: rgba(239, 68, 68, 0.5); }
.player-select-btn .num { font-size: 1.2rem; font-weight: 800; }
.player-select-btn .name { font-size: 0.6rem; color: var(--text-secondary); }

.shortcut-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--bg-elevated); border-radius: 8px; margin-bottom: 8px; }
.shortcut-row label { font-size: 0.85rem; }
.shortcut-key { padding: 8px 16px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 6px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer; min-width: 60px; text-align: center; }
.shortcut-key:focus { border-color: var(--accent); outline: none; }
.shortcut-key.recording { border-color: var(--warning); animation: pulse 0.5s infinite; }

.setup-screen { position: fixed; inset: 0; background: var(--bg-primary); z-index: 1000; display: flex; flex-direction: column; overflow-y: auto; }
.setup-screen.hidden { display: none; }
.setup-header { padding: 20px; text-align: center; background: var(--bg-secondary); border-bottom: 1px solid var(--border); }
.setup-header h1 { font-size: 1.4rem; margin: 0; }
.setup-inner { padding: 16px; max-width: 600px; margin: 0 auto; width: 100%; }
.setup-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.setup-section h3 { font-size: 0.9rem; color: var(--accent); margin-bottom: 12px; }
.inp { width: 100%; padding: 12px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit; font-size: 0.9rem; }
.btn-big { width: 100%; padding: 16px; background: var(--success); border: none; border-radius: 10px; color: white; font-weight: 800; font-size: 1rem; cursor: pointer; }
.btn-big:disabled { opacity: 0.5; }
.toggle-btns { display: flex; gap: 10px; }
.toggle-btn { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text-secondary); font-weight: 600; cursor: pointer; }
.toggle-btn.active { border-color: var(--accent); background: rgba(249, 115, 22, 0.2); color: var(--accent); }
.player-check { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border); }
.phase-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.phase-btn { padding: 10px 16px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg-elevated); color: var(--text-secondary); font-weight: 600; cursor: pointer; }
.phase-btn.active { border-color: var(--accent); background: rgba(249, 115, 22, 0.2); color: var(--accent); }
.firebase-status { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg-elevated); border-radius: 8px; }
.status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); }
.status-dot.ok { background: var(--success); }
.status-dot.err { background: var(--danger); }
.opp-row { display: grid; grid-template-columns: 60px 1fr 40px; gap: 8px; margin-bottom: 8px; }
.opp-row input { padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 6px; color: white; }
.opp-row .del { background: var(--danger); border: none; border-radius: 6px; color: white; cursor: pointer; }
.add-btn { width: 100%; padding: 10px; background: var(--bg-elevated); border: 2px dashed var(--border); border-radius: 8px; color: var(--text-muted); font-weight: 600; cursor: pointer; }

.toast { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: var(--bg-elevated); border: 1px solid var(--success); padding: 10px 20px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; z-index: 900; animation: slide-up 0.3s; }
.toast.error { border-color: var(--danger); }
.save-indicator { position: fixed; bottom: 20px; right: 20px; background: var(--bg-elevated); border: 1px solid var(--success); padding: 8px 16px; border-radius: 20px; font-size: 0.75rem; display: none; align-items: center; gap: 8px; z-index: 800; }
.save-indicator.show { display: flex; }
.mini-spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--success); border-radius: 50%; animation: spin 1s linear infinite; }

.toolbar-btn { padding: 4px 8px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 4px; color: var(--text-secondary); font-size: 0.6rem; cursor: pointer; }
.toolbar-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>
<div id="app-container">
    <div id="loadingScreen" class="loading-screen">
        <div class="spinner"></div>
        <div>Connexion à Firebase...</div>
    </div>

    <div id="setupScreen" class="setup-screen hidden">
        <div class="setup-header">
            <h1>🏀 Live Tracker V7.0</h1>
            <p>Champagne Basket U18 Elite</p>
        </div>
        <div class="setup-inner">
            <div class="setup-section">
                <h3>☁️ Firebase</h3>
                <div class="firebase-status">
                    <div class="status-dot" id="fbDot"></div>
                    <span id="fbStatus">Vérification...</span>
                </div>
            </div>
            <div class="setup-section">
                <h3>🆚 Adversaire</h3>
                <input type="text" id="oppName" class="inp" placeholder="Nom de l'équipe adverse">
            </div>
            <div class="setup-section">
                <h3>📍 Lieu</h3>
                <div class="toggle-btns">
                    <button class="toggle-btn active" id="btnHome" onclick="Setup.setLoc('home')">🏠 Domicile</button>
                    <button class="toggle-btn" id="btnAway" onclick="Setup.setLoc('away')">✈️ Extérieur</button>
                </div>
            </div>
            <div class="setup-section">
                <h3>📅 Phase</h3>
                <div class="phase-btns" id="phaseSelect"></div>
            </div>
            <div class="setup-section">
                <h3>👥 Mon Effectif</h3>
                <div id="rosterList" style="max-height:200px; overflow-y:auto;">Chargement...</div>
            </div>
            <div class="setup-section">
                <h3>👥 Effectif Adversaire</h3>
                <div id="oppRosterList"></div>

<script>
const FIREBASE_CONFIG = { 
    apiKey: "AIzaSyBaA99che1oz9BHc23IhiFoY-nK0xvg4q4", 
    authDomain: "statu18elite.firebaseapp.com", 
    projectId: "statu18elite", 
    storageBucket: "statu18elite.firebasestorage.app", 
    messagingSenderId: "862850988986", 
    appId: "1:862850988986:web:47a2b48477015506f6fb83" 
};

let db = null;
let firebaseRoster = [];
let firebasePhases = [{ id: 'phase1', name: 'Phase 1' }, { id: 'phase2', name: 'Phase 2' }];
let firebaseGames = [];

const State = {
    match: { id: null, date: null, opponent: 'Adversaire', isHome: true, quarter: 1, time: 600, running: false, phase: 'phase1', possession: 'home' },
    players: {},
    actions: [],
    onCourt: { home: [], away: [] },
    starters: { 1: [], 2: [], 3: [], 4: [] },
    ui: { sel: null, sub: null, pending: null, ctx: {}, shot: null, courtFirstShot: null, courtFilter: { team: 'all', quarter: 'all' }, massSubTeam: null, massSubSelection: [], assistTimeout: null },
    selectedIds: [],
    oppPlayers: [
        { num: '4', name: 'Joueur 4' }, { num: '5', name: 'Joueur 5' }, { num: '6', name: 'Joueur 6' },
        { num: '7', name: 'Joueur 7' }, { num: '8', name: 'Joueur 8' }, { num: '9', name: 'Joueur 9' },
        { num: '10', name: 'Joueur 10' }, { num: '11', name: 'Joueur 11' }, { num: '12', name: 'Joueur 12' },
        { num: '13', name: 'Joueur 13' }, { num: '14', name: 'Joueur 14' }, { num: '15', name: 'Joueur 15' },
    ]
};

const defaultShortcuts = { OREB: 'o', DREB: 'd', AST: 'a', STL: 's', TOV: 't', BLK: 'b', FOUL: 'f', UNDO: 'z', SUB: 'c', TIMER: ' ' };
let shortcuts = JSON.parse(localStorage.getItem('liveShortcuts')) || { ...defaultShortcuts };

async function initFirebase() {
    try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.firestore();
        const [rosterDoc, phasesDoc, gamesDoc] = await Promise.all([
            db.collection('team_data').doc('roster').get(),
            db.collection('team_data').doc('phases').get(),
            db.collection('team_data').doc('games').get()
        ]);
        if (rosterDoc.exists && rosterDoc.data().list) firebaseRoster = rosterDoc.data().list;
        if (phasesDoc.exists && phasesDoc.data().list) firebasePhases = phasesDoc.data().list;
        if (gamesDoc.exists && gamesDoc.data().list) firebaseGames = gamesDoc.data().list;
        document.getElementById('loadingScreen').classList.add('hidden');
        document.getElementById('setupScreen').classList.remove('hidden');
        Setup.init();
    } catch (e) {
        console.error(e);
        document.getElementById('loadingScreen').innerHTML = `<div style="color:var(--danger)">Erreur: ${e.message}</div>`;
    }
}

const Setup = {
    init() {
        const dot = document.getElementById('fbDot');
        const status = document.getElementById('fbStatus');
        if (db && firebaseRoster.length > 0) { dot.classList.add('ok'); status.textContent = `✅ ${firebaseRoster.length} joueurs`; }
        else { dot.classList.add('err'); status.textContent = '❌ Erreur'; }
        document.getElementById('phaseSelect').innerHTML = firebasePhases.map((p, i) => `<button class="phase-btn ${i === 0 ? 'active' : ''}" onclick="Setup.setPhase('${p.id}', this)">${p.name}</button>`).join('');
        State.match.phase = firebasePhases[0]?.id || 'phase1';
        this.renderRoster();
        this.renderOpp();
        this.checkMatchInProgress();
    },
    checkMatchInProgress() {
        const matchData = GameEngine.loadMatchInProgress();
        if (!matchData) return;
        const savedAt = new Date(matchData.savedAt);
        const now = new Date();
        const diffMinutes = Math.round((now - savedAt) / 60000);
        let homeScore = 0, awayScore = 0;
        matchData.actions.forEach(a => {
            const p = matchData.players[a.pid];
            if (!p) return;
            if (a.type === 'SHOT' && a.made) { if (p.team === 'home') homeScore += a.val; else awayScore += a.val; }
            if (a.type === 'FT' && a.ftMade > 0) { if (p.team === 'home') homeScore += a.ftMade; else awayScore += a.ftMade; }
        });
        const timeMin = Math.floor(matchData.match.time / 60);
        const timeSec = matchData.match.time % 60;
        const html = `<div style="text-align:center;padding:20px;"><div style="font-size:2rem;margin-bottom:10px;">⚠️</div><h3 style="margin-bottom:15px;color:var(--accent);">Match en cours détecté !</h3><div style="background:var(--bg-elevated);padding:15px;border-radius:10px;margin-bottom:15px;"><div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:5px;">Sauvegardé il y a ${diffMinutes} minute${diffMinutes > 1 ? 's' : ''}</div><div style="font-size:1.2rem;font-weight:700;margin-bottom:10px;">vs ${matchData.match.opponent}</div><div style="display:flex;justify-content:center;gap:20px;align-items:center;"><div style="text-align:center;"><div style="font-size:0.7rem;color:var(--text-muted);">NOUS</div><div style="font-size:1.8rem;font-weight:800;color:var(--home-color);">${homeScore}</div></div><div style="font-size:1.5rem;color:var(--text-muted);">-</div><div style="text-align:center;"><div style="font-size:0.7rem;color:var(--text-muted);">EUX</div><div style="font-size:1.8rem;font-weight:800;color:var(--away-color);">${awayScore}</div></div></div><div style="margin-top:10px;font-size:0.8rem;color:var(--text-secondary);">Q${matchData.match.quarter} • ${timeMin}:${timeSec.toString().padStart(2, '0')} restant</div></div><div style="font-size:0.75rem;color:var(--text-muted);">${matchData.actions.length} actions enregistrées</div></div>`;
        this.showResumeModal(html, matchData);
    },
    showResumeModal(html, matchData) {
        const modal = document.createElement('div');
        modal.id = 'resumeModal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(4px);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
        modal.innerHTML = `<div style="background:var(--bg-card);width:100%;max-width:400px;border-radius:14px;border:1px solid var(--border);overflow:hidden;"><div style="padding:16px;background:var(--bg-secondary);text-align:center;font-weight:700;border-bottom:1px solid var(--border);">🏀 Reprendre le match ?</div><div>${html}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;"><button onclick="Setup.discardMatch()" style="padding:14px;border-radius:8px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--danger);font-weight:700;cursor:pointer;">🗑️ Abandonner</button><button onclick="Setup.resumeMatch()" style="padding:14px;border-radius:8px;border:none;background:var(--success);color:white;font-weight:700;cursor:pointer;">▶️ Reprendre</button></div></div>`;
        document.body.appendChild(modal);
        this.pendingResumeData = matchData;
    },
    resumeMatch() {
        const modal = document.getElementById('resumeModal');
        if (modal) modal.remove();
        if (this.pendingResumeData) { GameEngine.resumeMatch(this.pendingResumeData); this.pendingResumeData = null; }
    },
    discardMatch() {
        const modal = document.getElementById('resumeModal');
        if (modal) modal.remove();
        GameEngine.clearMatchInProgress();
        this.pendingResumeData = null;
        UI.toast('Match abandonné');
    },
    renderRoster() {
        const div = document.getElementById('rosterList');
        if (!firebaseRoster.length) { div.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">Aucun joueur</div>'; return; }
        div.innerHTML = firebaseRoster.map(p => `<div class="player-check"><input type="checkbox" id="p${p.id}" checked onchange="Setup.toggle(${p.id})"><label for="p${p.id}"><b>#${p.number}</b> ${p.name}</label></div>`).join('');
        State.selectedIds = firebaseRoster.map(p => p.id);
        document.getElementById('startBtn').disabled = false;
    },
    toggle(id) { const i = State.selectedIds.indexOf(id); if (i >= 0) State.selectedIds.splice(i, 1); else State.selectedIds.push(id); },
    renderOpp() { document.getElementById('oppRosterList').innerHTML = State.oppPlayers.map((p, i) => `<div class="opp-row"><input value="${p.num}" placeholder="#" onchange="Setup.updateOpp(${i},'num',this.value)"><input value="${p.name}" placeholder="Nom" onchange="Setup.updateOpp(${i},'name',this.value)"><button class="del" onclick="Setup.delOpp(${i})">×</button></div>`).join(''); },
    updateOpp(i, k, v) { State.oppPlayers[i][k] = v; },
    addOpp() { State.oppPlayers.push({ num: '', name: '' }); this.renderOpp(); },
    delOpp(i) { if (State.oppPlayers.length > 1) { State.oppPlayers.splice(i, 1); this.renderOpp(); } },
    setPhase(id, btn) { document.querySelectorAll('.phase-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); State.match.phase = id; },
    setLoc(loc) { State.match.isHome = loc === 'home'; document.getElementById('btnHome').classList.toggle('active', loc === 'home'); document.getElementById('btnAway').classList.toggle('active', loc === 'away'); },
    startMatch() {
        State.match.id = Date.now();
        State.match.date = new Date().toLocaleDateString('fr-FR');
        State.match.opponent = document.getElementById('oppName').value || 'Adversaire';
        document.getElementById('lblAway').textContent = State.match.opponent;
        State.selectedIds.forEach(id => {
            const p = firebaseRoster.find(x => x.id === id);
            if (p) State.players[p.id] = { id: p.id, number: p.number, name: p.name, team: 'home', stats: { pts: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fouls: 0, foulDrawn: 0, fgm: 0, fga: 0, fg3m: 0, fg3a: 0, ftm: 0, fta: 0, min: 0, plusMinus: 0, blkAgainst: 0, shotChart: [] } };
        });
        State.oppPlayers.filter(p => p.num).forEach((p, i) => {
            const id = 1000 + i;
            State.players[id] = { id, number: p.num, name: p.name || `Adv ${p.num}`, team: 'away', stats: { pts: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fouls: 0, foulDrawn: 0, fgm: 0, fga: 0, fg3m: 0, fg3a: 0, ftm: 0, fta: 0, min: 0, plusMinus: 0, blkAgainst: 0, shotChart: [] } };
        });
        State.onCourt.home = Object.values(State.players).filter(p => p.team === 'home').slice(0, 5).map(p => p.id);
        State.onCourt.away = Object.values(State.players).filter(p => p.team === 'away').slice(0, 5).map(p => p.id);
        State.starters[1] = [...State.onCourt.home];
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('app').style.display = 'flex';
        Court.init();
        UI.init();
        Keyboard.init();
    }
};

const Keyboard = {
    recording: null,
    init() {
        this.updateDisplay();
        document.addEventListener('keydown', (e) => {
            if (this.recording) return;
            if (e.target.tagName === 'INPUT') return;
            const key = e.key.toLowerCase();
            if (key === shortcuts.TIMER || key === ' ') { e.preventDefault(); GameEngine.toggleTimer(); return; }
            if (key === shortcuts.OREB) { GameEngine.action('OREB'); return; }
            if (key === shortcuts.DREB) { GameEngine.action('DREB'); return; }
            if (key === shortcuts.AST) { GameEngine.startAssist(); return; }
            if (key === shortcuts.STL) { GameEngine.action('STL'); return; }
            if (key === shortcuts.TOV) { GameEngine.action('TOV'); return; }
            if (key === shortcuts.BLK) { GameEngine.startBlock(); return; }
            if (key === shortcuts.FOUL) { GameEngine.startFoul(); return; }
            if (key === shortcuts.UNDO) { GameEngine.undo(); return; }
            if (key === shortcuts.SUB) { GameEngine.startSub(); return; }
            const num = parseInt(key);
            if (!isNaN(num)) {
                const player = Object.values(State.players).find(p => p.number == num || p.number == key);
                if (player) GameEngine.handlePlayerClick(player.id);
            }
        });
    },
    updateDisplay() { Object.keys(shortcuts).forEach(action => { const el = document.getElementById(`sk-${action}`); if (el) el.textContent = shortcuts[action].toUpperCase(); }); },
    startRecording(action, el) {
        if (this.recording) return;
        this.recording = action;
        el.classList.add('recording');
        el.textContent = '...';
        const handler = (e) => {
            e.preventDefault();
            shortcuts[action] = e.key.toLowerCase();
            localStorage.setItem('liveShortcuts', JSON.stringify(shortcuts));
            el.classList.remove('recording');
            el.textContent = e.key.toUpperCase();
            this.recording = null;
            this.updateDisplay();
            document.removeEventListener('keydown', handler);
        };
        document.addEventListener('keydown', handler);
    },
    reset() { shortcuts = { ...defaultShortcuts }; localStorage.setItem('liveShortcuts', JSON.stringify(shortcuts)); this.updateDisplay(); UI.showShortcutsModal(); }
};

const GameEngine = {
    timer: null,

    // === TIMER ===
    toggleTimer() {
        State.match.running = !State.match.running;
        if (State.match.running) {
            this.timer = setInterval(() => {
                if (State.match.time > 0) {
                    State.match.time--;
                    [...State.onCourt.home, ...State.onCourt.away].forEach(id => { if (State.players[id]) State.players[id].stats.min++; });
                    UI.updateHeader();
                    if (State.match.time % 30 === 0) this.saveMatchInProgress();
                } else { this.endQuarter(); }
            }, 1000);
        } else {
            clearInterval(this.timer);
            this.saveMatchInProgress();
        }
        UI.updateHeader();
    },

    adjustTimer(delta) {
        const maxTime = State.match.quarter > 4 ? 300 : 600;
        State.match.time = Math.max(0, Math.min(maxTime, State.match.time + delta));
        UI.updateHeader();
    },

    endQuarter() {
        clearInterval(this.timer);
        State.match.running = false;
        State.match.quarter++;
        State.match.time = 600;
        this.togglePossession();
        UI.updateHeader();
        UI.toast(`Fin Q${State.match.quarter - 1}`);
        this.saveMatchInProgress();
        if (State.match.quarter <= 4) this.setStarters();
    },

    // === POSSESSION ===
    togglePossession() {
        State.match.possession = State.match.possession === 'home' ? 'away' : 'home';
        this.updatePossessionDisplay();
    },

    updatePossessionDisplay() {
        const el = document.getElementById('possArrow');
        if (!el) return;
        el.innerHTML = State.match.possession === 'home' ? '⬅️🏀' : '🏀➡️';
        el.style.color = State.match.possession === 'home' ? 'var(--home-color)' : 'var(--away-color)';
    },

    // === STARTERS ===
    setStarters() {
        const q = State.match.quarter;
        const homePlayers = Object.values(State.players).filter(p => p.team === 'home');
        let html = `<p style="margin-bottom:12px;color:var(--text-secondary);">Sélectionnez les 5 titulaires pour le Q${q}</p><div class="player-select-grid">`;
        homePlayers.forEach(p => {
            const selected = State.starters[q]?.includes(p.id) || State.onCourt.home.includes(p.id);
            html += `<div class="player-select-btn home ${selected ? 'selected' : ''}" onclick="GameEngine.toggleStarter(${p.id}, this)"><div class="num">${p.number}</div><div class="name">${p.name}</div></div>`;
        });
        html += `</div>`;
        UI.showModal(`⭐ 5 de Départ - Q${q}`, html, [{ text: 'Annuler', action: 'UI.closeModal()', class: '' }, { text: '✔ Valider', action: 'GameEngine.confirmStarters()', class: 'success' }], 'g-2');
        State.ui.tempStarters = State.starters[q]?.length ? [...State.starters[q]] : [...State.onCourt.home];
    },

    toggleStarter(id, el) {
        const idx = State.ui.tempStarters.indexOf(id);
        if (idx >= 0) { State.ui.tempStarters.splice(idx, 1); el.classList.remove('selected'); }
        else if (State.ui.tempStarters.length < 5) { State.ui.tempStarters.push(id); el.classList.add('selected'); }
        else { UI.toast('5 joueurs max', 'error'); }
    },

    confirmStarters() {
        if (State.ui.tempStarters.length !== 5) { UI.toast('Sélectionnez 5 joueurs', 'error'); return; }
        const q = State.match.quarter;
        State.starters[q] = [...State.ui.tempStarters];
        State.onCourt.home = [...State.ui.tempStarters];
        UI.closeModal();
        UI.renderRoster();
        UI.updateOncourt();
        UI.toast(`5 de départ Q${q} enregistré`);
    },

    // === MASS SUBS (Feature 4) ===
    openMassSubMode(team = 'home') {
        const teamPlayers = Object.values(State.players).filter(p => p.team === team);
        State.ui.massSubTeam = team;
        State.ui.massSubSelection = [...State.onCourt[team]];
        const teamLabel = team === 'home' ? '🏠 Notre équipe' : '🚨 Adversaire';
        let html = `<p style="margin-bottom:12px;color:var(--text-secondary);">Sélectionnez les 5 joueurs (${State.ui.massSubSelection.length}/5)</p><div class="player-select-grid">`;
        teamPlayers.forEach(p => {
            const isSelected = State.ui.massSubSelection.includes(p.id);
            const colorClass = team === 'home' ? 'home' : 'away';
            html += `<div class="player-select-btn ${colorClass} ${isSelected ? 'selected' : ''}" id="mass-sub-${p.id}" onclick="GameEngine.toggleMassSubPlayer(${p.id})"><div class="num">${p.number}</div><div class="name">${p.name}</div></div>`;
        });
        html += `</div>`;
        UI.showModal(`🔁 ${teamLabel} - Changement 5`, html, [{ text: 'Annuler', action: 'UI.closeModal()', class: '' }, { text: '✔ Valider', action: 'GameEngine.confirmMassSub()', class: 'success' }], 'g-2');
    },

    toggleMassSubPlayer(id) {
        const idx = State.ui.massSubSelection.indexOf(id);
        const el = document.getElementById(`mass-sub-${id}`);
        if (idx >= 0) { State.ui.massSubSelection.splice(idx, 1); el?.classList.remove('selected'); }
        else if (State.ui.massSubSelection.length < 5) { State.ui.massSubSelection.push(id); el?.classList.add('selected'); }
        else { UI.toast('5 joueurs max', 'error'); return; }
        const p = document.querySelector('.modal-body p');
        if (p) p.textContent = `Sélectionnez les 5 joueurs (${State.ui.massSubSelection.length}/5)`;
    },

    confirmMassSub() {
        if (State.ui.massSubSelection.length !== 5) { UI.toast('Sélectionnez exactement 5 joueurs', 'error'); return; }
        const team = State.ui.massSubTeam;
        const oldOnCourt = [...State.onCourt[team]];
        const newOnCourt = [...State.ui.massSubSelection];
        const playersOut = oldOnCourt.filter(id => !newOnCourt.includes(id));
        const playersIn = newOnCourt.filter(id => !oldOnCourt.includes(id));
        const subCount = Math.min(playersOut.length, playersIn.length);
        for (let i = 0; i < subCount; i++) { this.log('SUB', playersOut[i], { inId: playersIn[i] }); }
        State.onCourt[team] = newOnCourt;
        State.ui.massSubTeam = null;
        State.ui.massSubSelection = [];
        UI.closeModal();
        UI.renderRoster();
        UI.updateOncourt();
        UI.toast(`✅ ${subCount} changement(s) effectué(s)`);
    },

    // === PLAYER CLICK ===
    handlePlayerClick(id) {
        const p = State.players[id];
        if (State.ui.pending === 'REBOUND_WAITING') { State.ui.pending = null; this.highlightReboundButtons(false); }
        if (State.ui.sub === 'out') {
            if (!State.onCourt[p.team].includes(id)) return UI.toast('Pas sur terrain', 'error');
            State.ui.subOut = id;
            State.ui.sub = 'in';
            State.ui.subTeam = p.team;
            return UI.toast('Qui entre ?');
        }
        if (State.ui.sub === 'in') {
            if (p.team !== State.ui.subTeam) return UI.toast('Mauvaise équipe', 'error');
            if (State.onCourt[p.team].includes(id)) return UI.toast('Déjà sur terrain', 'error');
            return this.execSub(State.ui.subOut, id);
        }
        if (State.ui.pending === 'AST_SEL') {
            if (p.team !== State.players[State.ui.ctx.passer].team || p.id === State.ui.ctx.passer) return;
            State.ui.ctx.receiver = id;
            State.ui.pending = 'AST_LOC';
            Court.showMsg('Position du tir ?');
            return;
        }
        if (State.ui.pending === 'FOUL_WHO') { State.ui.ctx.fouler = id; State.ui.pending = 'FOUL_VICTIM'; UI.toast('Qui a subi la faute ?'); return; }
        if (State.ui.pending === 'FOUL_VICTIM') {
            if (p.team === State.players[State.ui.ctx.fouler].team) return UI.toast('Autre équipe !', 'error');
            State.ui.ctx.victim = id;
            this.showFoulTypeModal();
            return;
        }
        if (State.ui.pending === 'BLK_WHO') { State.ui.ctx.blocker = id; this.showBlockVictimSelect(); return; }
        if (State.ui.pending === 'BLK_VICTIM') {
            const blocker = State.players[State.ui.ctx.blocker];
            if (p.team === blocker.team) return UI.toast('Équipe différente !', 'error');
            State.ui.ctx.shooter = id;
            State.ui.pending = 'BLK_LOC';
            Court.showMsg('Zone du tir contré ?');
            return;
        }
        State.ui.sel = State.ui.sel === id ? null : id;
        UI.renderRoster();
    },

    startSub() { State.ui.sub = 'out'; UI.toast('Qui sort ?'); },

    execSub(outId, inId) {
        const t = State.players[outId].team;
        const i = State.onCourt[t].indexOf(outId);
        State.onCourt[t][i] = inId;
        this.log('SUB', outId, { inId });
        State.ui.sub = null;
        UI.renderRoster();
        UI.updateOncourt();
        UI.toast(`#${State.players[outId].number} ↔ #${State.players[inId].number}`);
    },

    // === COURT CLICK ===
    handleCourtClick(x, y, val) {
        if (State.ui.pending === 'FOUL_LOC') {
            State.ui.ctx.loc = { x, y, val };
            Court.hideMsg();
            UI.showModal('Tir sur Faute', `<p>Tir ${val}pts - Panier ?</p>`, [{ text: '✔ And-1', action: 'GameEngine.foulResult(true)', class: 'success' }, { text: '✗ Raté', action: 'GameEngine.foulResult(false)', class: 'danger' }], 'g-2');
            return;
        }
        if (State.ui.pending === 'BLK_LOC') { this.finishBlock(x, y, val); return; }
        if (State.ui.pending === 'AST_LOC') {
            Court.hideMsg();
            State.ui.pending = null;
            this.recordShot(State.ui.ctx.receiver, val, true, x, y, State.ui.ctx.passer);
            State.ui.ctx = {};
            return;
        }
        // Feature 1: Court-First Flow
        if (!State.ui.sel && !State.ui.pending) {
            State.ui.courtFirstShot = { x, y, val };
            this.showCourtFirstModal();
            return;
        }
        if (!State.ui.sel) return UI.toast('Sélectionnez joueur', 'error');
        State.ui.shot = { pid: State.ui.sel, x, y, val };
        document.getElementById('shotPopup').classList.add('active');
    },

    // === COURT-FIRST (Feature 1) ===
    showCourtFirstModal() {
        const shot = State.ui.courtFirstShot;
        if (!shot) return;
        const allOnCourt = [...State.onCourt.home, ...State.onCourt.away].map(id => State.players[id]).filter(p => p);
        if (!allOnCourt.length) { UI.toast('Personne sur le terrain', 'error'); State.ui.courtFirstShot = null; return; }
        let html = `<p style="margin-bottom:12px;color:var(--text-secondary);">Tir ${shot.val}pts - Qui tire ?</p><div class="player-select-grid">`;
        allOnCourt.filter(p => p.team === 'home').forEach(p => { html += `<div class="player-select-btn home" onclick="GameEngine.confirmCourtFirstShot(${p.id})"><div class="num">${p.number}</div><div class="name">${p.name}</div></div>`; });
        allOnCourt.filter(p => p.team === 'away').forEach(p => { html += `<div class="player-select-btn away" onclick="GameEngine.confirmCourtFirstShot(${p.id})"><div class="num" style="color:var(--away-color)">${p.number}</div><div class="name">${p.name}</div></div>`; });
        html += `</div>`;
        UI.showModal(`🏀 Tir ${shot.val}pts`, html, [{ text: 'Annuler', action: 'GameEngine.cancelCourtFirst()', class: '' }], 'g-1');
    },

    confirmCourtFirstShot(pid) {
        UI.closeModal();
        const shot = State.ui.courtFirstShot;
        if (!shot) return;
        State.ui.sel = pid;
        State.ui.shot = { pid, x: shot.x, y: shot.y, val: shot.val };
        State.ui.courtFirstShot = null;
        document.getElementById('shotPopup').classList.add('active');
        UI.renderRoster();
    },

    cancelCourtFirst() { State.ui.courtFirstShot = null; UI.closeModal(); },

    // === SHOT ===
    confirmShot(made) {
        document.getElementById('shotPopup').classList.remove('active');
        const s = State.ui.shot;
        if (s) {
            this.recordShot(s.pid, s.val, made, s.x, s.y);
            // Feature 2: Rebound Flow
            if (!made) {
                State.ui.pending = 'REBOUND_WAITING';
                this.highlightReboundButtons(true);
                UI.toast('Rebond ?');
            }
        }
        State.ui.shot = null;
    },

    highlightReboundButtons(active) {
        document.querySelectorAll('[data-action="OREB"], [data-action="DREB"]').forEach(btn => { btn.classList.toggle('highlight-reb', active); });
    },

    recordShot(pid, val, made, x, y, astId = null) {
        const p = State.players[pid];
        if (!p) return;
        if (val === 3) { p.stats.fg3a++; if (made) { p.stats.fg3m++; p.stats.pts += 3; } }
        else { p.stats.fga++; if (made) { p.stats.fgm++; p.stats.pts += val; } }
        if (astId && made) State.players[astId].stats.ast++;
        p.stats.shotChart.push({ x, y, val, made, blocked: false });
        if (made) {
            UI.animScore(p.team);
            this.updatePlusMinus(p.team, val);
            this.checkAndAlertRun();
            // Feature 3: Post-Hoc Assist
            if (!astId && p.team === 'home') { setTimeout(() => this.showPostHocAssist(pid), 300); }
        }
        this.log('SHOT', pid, { val, made, x, y, astId });
        UI.renderRoster();
        UI.updateHeader();
        Court.draw();
    },

    // === POST-HOC ASSIST (Feature 3) ===
    showPostHocAssist(scorerId) {
        const scorer = State.players[scorerId];
        if (!scorer) return;
        const teammates = State.onCourt[scorer.team].filter(id => id !== scorerId).map(id => State.players[id]).filter(p => p);
        if (!teammates.length) return;
        let html = '';
        teammates.forEach(p => { html += `<div class="assist-btn" onclick="GameEngine.assignPostHocAssist(${p.id})"><span class="num">${p.number}</span><span class="name">${p.name}</span></div>`; });
        html += `<button class="no-assist" onclick="GameEngine.closePostHocAssist()">Pas de passe</button>`;
        const overlay = document.getElementById('assistOverlay');
        overlay.innerHTML = html;
        overlay.style.display = 'flex';
        State.ui.assistTimeout = setTimeout(() => this.closePostHocAssist(), 4000);
    },

    assignPostHocAssist(passerId) {
        for (let i = State.actions.length - 1; i >= 0; i--) {
            const a = State.actions[i];
            if (a.type === 'SHOT' && a.made && !a.astId) { a.astId = passerId; State.players[passerId].stats.ast++; UI.toast(`✅ Passe #${State.players[passerId].number}`); break; }
        }
        this.closePostHocAssist();
        UI.renderRoster();
    },

    closePostHocAssist() { clearTimeout(State.ui.assistTimeout); document.getElementById('assistOverlay').style.display = 'none'; },

    // === TRANSFER (Feature 5) ===
    showTransferLastAction() {
        if (!State.actions.length) return UI.toast('Aucune action', 'error');
        const lastAction = State.actions[State.actions.length - 1];
        const lastPlayer = State.players[lastAction.pid];
        if (!lastPlayer) return;
        const teammates = State.onCourt[lastPlayer.team].filter(id => id !== lastAction.pid).map(id => State.players[id]).filter(p => p);
        if (!teammates.length) return UI.toast('Pas de coéquipier', 'error');
        let html = `<p style="margin-bottom:12px;color:var(--text-secondary);">Réattribuer "${lastAction.type}" de #${lastPlayer.number} à :</p><div class="player-select-grid">`;
        teammates.forEach(p => { html += `<div class="player-select-btn" onclick="GameEngine.transferAction(${p.id})"><div class="num">${p.number}</div><div class="name">${p.name}</div></div>`; });
        html += `</div>`;
        UI.showModal('🔄 Transférer Action', html, [{ text: 'Annuler', action: 'UI.closeModal()', class: '' }], 'g-1');
    },

    transferAction(newPid) {
        if (!State.actions.length) return;
        State.actions[State.actions.length - 1].pid = newPid;
        this.recalc();
        UI.closeModal();
        UI.renderRoster();
        UI.updateHeader();
        UI.toast(`✅ Transféré à #${State.players[newPid]?.number}`);
    },

    // === RUNS (Feature 10) ===
    analyzeMomentum() {
        const scoringActions = State.actions.filter(a => (a.type === 'SHOT' && a.made) || (a.type === 'FT' && a.ftMade > 0)).slice(-10);
        if (scoringActions.length < 2) return null;
        let homeRun = 0, awayRun = 0, lastTeam = null;
        for (let i = scoringActions.length - 1; i >= 0; i--) {
            const a = scoringActions[i];
            const p = State.players[a.pid];
            if (!p) continue;
            const pts = a.type === 'SHOT' ? a.val : (a.ftMade || 0);
            const team = p.team;
            if (lastTeam === null) lastTeam = team;
            if (team !== lastTeam) break;
            if (team === 'home') homeRun += pts; else awayRun += pts;
        }
        if (homeRun >= 6) return { team: 'home', pts: homeRun };
        if (awayRun >= 6) return { team: 'away', pts: awayRun };
        return null;
    },

    checkAndAlertRun() {
        const run = this.analyzeMomentum();
        if (run) {
            const label = run.team === 'home' ? '🔥 NOUS' : '🚨 ADVERSAIRE';
            UI.toast(`${label} : Run ${run.pts}-0 !`, run.team === 'away' ? 'error' : 'success');
        }
    },

    updatePlusMinus(scoringTeam, points) {
        State.onCourt.home.forEach(id => { if (State.players[id]) State.players[id].stats.plusMinus += (scoringTeam === 'home' ? points : -points); });
        State.onCourt.away.forEach(id => { if (State.players[id]) State.players[id].stats.plusMinus += (scoringTeam === 'away' ? points : -points); });
    },

    // === ACTIONS ===
    action(type) {
        if ((type === 'OREB' || type === 'DREB') && State.ui.pending === 'REBOUND_WAITING') { State.ui.pending = null; this.highlightReboundButtons(false); }
        if (!State.ui.sel) return UI.toast('Sélectionnez joueur', 'error');
        const p = State.players[State.ui.sel];
        const map = { OREB: 'oreb', DREB: 'dreb', STL: 'stl', BLK: 'blk', TOV: 'tov' };
        if (map[type]) { p.stats[map[type]]++; this.log(type, State.ui.sel); UI.renderRoster(); UI.toast(type); }
    },

    startAssist() {
        if (!State.ui.sel) return UI.toast('Qui passe ?', 'error');
        State.ui.ctx = { passer: State.ui.sel };
        State.ui.pending = 'AST_SEL';
        UI.toast('Sélectionnez buteur');
    },

    startFoul() {
        if (State.match.running) { this.toggleTimer(); UI.toast('⏸️ Timer stoppé - Qui fait la faute ?'); }
        else { UI.toast('Qui fait la faute ?'); }
        State.ui.pending = 'FOUL_WHO';
        State.ui.ctx = {};
    },

    startBlock() { UI.toast('Qui a contré ?'); State.ui.pending = 'BLK_WHO'; State.ui.ctx = {}; },

    showBlockVictimSelect() { State.ui.pending = 'BLK_VICTIM'; UI.toast('Qui s\'est fait contrer ?'); },

    finishBlock(x, y, val) {
        Court.hideMsg();
        const blocker = State.players[State.ui.ctx.blocker];
        const shooter = State.players[State.ui.ctx.shooter];
        if (!blocker || !shooter) { UI.toast('Erreur joueurs', 'error'); State.ui.ctx = {}; State.ui.pending = null; return; }
        blocker.stats.blk++;
        shooter.stats.blkAgainst++;
        if (val === 3) { shooter.stats.fg3a++; } else { shooter.stats.fga++; }
        shooter.stats.shotChart.push({ x, y, val, made: false, blocked: true });
        this.log('BLK', State.ui.ctx.blocker, { victim: State.ui.ctx.shooter, x, y, val });
        State.ui.ctx = {};
        State.ui.pending = null;
        UI.renderRoster();
        UI.updateHeader();
        Court.draw();
        UI.toast(`Contre #${blocker.number} sur #${shooter.number}`);
    },

    showFoulTypeModal() {
        State.ui.pending = null;
        const fouler = State.players[State.ui.ctx.fouler];
        const victim = State.players[State.ui.ctx.victim];
        UI.showModal('Type de Faute', `<div style="text-align:center;margin-bottom:16px;"><div style="color:var(--danger);font-weight:700;">#${fouler.number} ${fouler.name}</div><div style="font-size:0.8rem;color:var(--text-muted);">fait faute sur</div><div style="color:var(--success);font-weight:700;">#${victim.number} ${victim.name}</div></div>`, [{ text: '🏃 Faute de jeu', action: 'GameEngine.foulType(false)', class: '' }, { text: '🎯 Faute sur tir', action: 'GameEngine.foulType(true)', class: 'prim' }], 'g-2');
    },

    foulType(shooting) {
        UI.closeModal();
        if (shooting) { State.ui.pending = 'FOUL_LOC'; Court.showMsg('Position du tir ?'); }
        else { UI.showModal('Lancers Francs ?', '', [{ text: '0 LF', action: 'GameEngine.finishFoul(0,0)', class: '' }, { text: '2 LF', action: 'GameEngine.askLF(2)', class: 'prim' }], 'g-2'); }
    },

    foulResult(made) {
        UI.closeModal();
        const ctx = State.ui.ctx;
        if (made) { this.recordShot(ctx.victim, ctx.loc.val, true, ctx.loc.x, ctx.loc.y); this.askLF(1); }
        else { this.askLF(ctx.loc.val); }
    },

    askLF(n) {
        State.ui.ctx.lfCount = n;
        const btns = [];
        for (let i = 0; i <= n; i++) btns.push({ text: `${i}/${n}`, action: `GameEngine.finishFoul(${i},${n})`, class: i === n ? 'success' : '' });
        UI.showModal(`${n} LF`, '', btns, `g-${n + 1}`);
    },

    finishFoul(made, att) {
        UI.closeModal();
        const fouler = State.players[State.ui.ctx.fouler];
        const victim = State.players[State.ui.ctx.victim];
        fouler.stats.fouls++;
        victim.stats.foulDrawn++;
        this.log('FOUL', State.ui.ctx.fouler, { victim: State.ui.ctx.victim });
        if (att > 0) {
            victim.stats.ftm += made;
            victim.stats.fta += att;
            victim.stats.pts += made;
            this.log('FT', State.ui.ctx.victim, { ftMade: made, ftAtt: att, fromFoul: State.ui.ctx.fouler });
            if (made > 0) { UI.animScore(victim.team); this.updatePlusMinus(victim.team, made); this.checkAndAlertRun(); }
        }
        State.ui.ctx = {};
        State.ui.pending = null;
        UI.renderRoster();
        UI.updateHeader();
    },

    log(type, pid, data = {}) {
        State.actions.push({ id: Date.now(), type, pid, time: State.match.time, q: State.match.quarter, onCourt: [...State.onCourt.home, ...State.onCourt.away], ...data });
        this.saveMatchInProgress();
    },

    undo() {
        if (!State.actions.length) return UI.toast('Rien', 'error');
        State.actions.pop();
        this.recalc();
        UI.renderRoster();
        UI.updateHeader();
        Court.draw();
        UI.toast('Annulé');
    },

    recalc() {
        Object.values(State.players).forEach(p => { p.stats = { pts: 0, oreb: 0, dreb: 0, ast: 0, stl: 0, blk: 0, tov: 0, fouls: 0, foulDrawn: 0, fgm: 0, fga: 0, fg3m: 0, fg3a: 0, ftm: 0, fta: 0, min: p.stats.min, plusMinus: 0, blkAgainst: 0, shotChart: [] }; });
        State.actions.forEach(a => {
            const p = State.players[a.pid];
            if (!p) return;
            if (a.type === 'SHOT') {
                if (a.val === 3) { p.stats.fg3a++; if (a.made) { p.stats.fg3m++; p.stats.pts += 3; } }
                else { p.stats.fga++; if (a.made) { p.stats.fgm++; p.stats.pts += a.val; } }
                if (a.astId && a.made && State.players[a.astId]) State.players[a.astId].stats.ast++;
                if (a.made && a.onCourt) { a.onCourt.forEach(id => { if (State.players[id]) { const isScorer = State.players[id].team === p.team; State.players[id].stats.plusMinus += isScorer ? a.val : -a.val; } }); }
            }
            if (a.type === 'OREB') p.stats.oreb++;
            if (a.type === 'DREB') p.stats.dreb++;
            if (a.type === 'STL') p.stats.stl++;
            if (a.type === 'BLK') {
                p.stats.blk++;
                if (a.victim && State.players[a.victim]) {
                    const shooter = State.players[a.victim];
                    shooter.stats.blkAgainst++;
                    if (a.val === 3) { shooter.stats.fg3a++; } else { shooter.stats.fga++; }
                    shooter.stats.shotChart.push({ x: a.x, y: a.y, val: a.val, made: false, blocked: true });
                }
            }
            if (a.type === 'TOV') p.stats.tov++;
            if (a.type === 'FOUL') { p.stats.fouls++; if (a.victim && State.players[a.victim]) { State.players[a.victim].stats.foulDrawn++; } }
            if (a.type === 'FT') {
                p.stats.ftm += a.ftMade || 0;
                p.stats.fta += a.ftAtt || 0;
                p.stats.pts += a.ftMade || 0;
                if (a.ftMade > 0 && a.onCourt) { a.onCourt.forEach(id => { if (State.players[id]) { const isShooterTeam = State.players[id].team === p.team; State.players[id].stats.plusMinus += isShooterTeam ? a.ftMade : -a.ftMade; } }); }
            }
        });
    },

    // === INSERT POST-HOC (Feature 8) ===
    showInsertActionModal(afterIndex) {
        const prevAction = afterIndex >= 0 ? State.actions[afterIndex] : null;
        const nextAction = State.actions[afterIndex + 1] || null;
        let interpolatedTime, interpolatedQ;
        if (prevAction && nextAction) { interpolatedTime = Math.round((prevAction.time + nextAction.time) / 2); interpolatedQ = prevAction.q; }
        else if (prevAction) { interpolatedTime = Math.max(0, prevAction.time - 5); interpolatedQ = prevAction.q; }
        else if (nextAction) { interpolatedTime = nextAction.time + 5; interpolatedQ = nextAction.q; }
        else { interpolatedTime = State.match.time; interpolatedQ = State.match.quarter; }
        State.ui.insertAfterIndex = afterIndex;
        const allPlayers = Object.values(State.players);
        const types = ['OREB', 'DREB', 'STL', 'BLK', 'TOV'];

        UI.showModal('➕ Insérer Action', html, [{ text: 'Annuler', action: 'UI.closeModal()', class: '' }, { text: '✔ Insérer', action: 'GameEngine.confirmInsertAction()', class: 'success' }], 'g-2');
    },

    confirmInsertAction() {
        const pid = parseInt(document.getElementById('insertPlayer').value);

        State.actions.splice(State.ui.insertAfterIndex + 1, 0, newAction);
        State.actions.sort((a, b) => { if (a.q !== b.q) return a.q - b.q; return b.time - a.time; });

        UI.closeModal();
        UI.renderLogs();
        UI.renderRoster();

    showQuarterModal() { UI.showModal('Période', '', [1, 2, 3, 4, 5].map(q => ({ text: q < 5 ? `Q${q}` : 'OT', action: `GameEngine.setQ(${q})`, class: State.match.quarter === q ? 'prim' : '' })), 'g-5'); },
    setQ(q) { State.match.quarter = q; UI.closeModal(); UI.updateHeader(); },
    showTimerEditModal() { const m = Math.floor(State.match.time / 60), s = State.match.time % 60; UI.showModal('Chrono', `<input id="nT" class="inp" value="${m}:${s < 10 ? '0' + s : s}" style="text-align:center;font-size:1.5rem;">`, [{ text: 'Annuler', action: 'UI.closeModal()', class: '' }, { text: 'OK', action: 'GameEngine.setT()', class: 'prim' }], 'g-2'); },
    setT() { const v = document.getElementById('nT').value.split(':'); if (v.length === 2) State.match.time = parseInt(v[0]) * 60 + parseInt(v[1]); UI.closeModal(); UI.updateHeader(); },
    getScore() { let home = 0, away = 0; State.actions.forEach(a => { const p = State.players[a.pid]; if (!p) return; if (a.type === 'SHOT' && a.made) { if (p.team === 'home') home += a.val; else away += a.val; } if (a.type === 'FT' && a.ftMade > 0) { if (p.team === 'home') home += a.ftMade; else away += a.ftMade; } }); return { home, away }; },

    // === SAVE ===
    saveToFirebase() {
        if (!db) return UI.toast('Non connecté', 'error');
        const scores = this.getScore();
        const playerStats = {};
        Object.values(State.players).filter(p => p.team === 'home').forEach(p => { playerStats[p.id] = { pts: p.stats.pts, reb: p.stats.oreb + p.stats.dreb, oreb: p.stats.oreb, dreb: p.stats.dreb, ast: p.stats.ast, stl: p.stats.stl, blk: p.stats.blk, blkAgainst: p.stats.blkAgainst, tov: p.stats.tov, fga: p.stats.fga, fgm: p.stats.fgm, threePA: p.stats.fg3a, threePM: p.stats.fg3m, fta: p.stats.fta, ftm: p.stats.ftm, pf: p.stats.fouls, minutes: Math.round(p.stats.min / 60), plusMinus: p.stats.plusMinus, shotChart: p.stats.shotChart || [] }; });
        const opponentStats = { pts: scores.away, reb: 0, oreb: 0, ast: 0, tov: 0, fouls: 0, fga: 0, fgm: 0, fta: 0, ftm: 0 };
        const opponentPlayerStats = {};
        Object.values(State.players).filter(p => p.team === 'away').forEach(p => { opponentStats.reb += p.stats.oreb + p.stats.dreb; opponentStats.oreb += p.stats.oreb; opponentStats.ast += p.stats.ast; opponentStats.tov += p.stats.tov; opponentStats.fouls += p.stats.fouls; opponentStats.fga += p.stats.fga + p.stats.fg3a; opponentStats.fgm += p.stats.fgm + p.stats.fg3m; opponentStats.fta += p.stats.fta; opponentStats.ftm += p.stats.ftm; opponentPlayerStats[p.id] = { pts: p.stats.pts, reb: p.stats.oreb + p.stats.dreb, oreb: p.stats.oreb, dreb: p.stats.dreb, ast: p.stats.ast, stl: p.stats.stl, blk: p.stats.blk, blkAgainst: p.stats.blkAgainst, tov: p.stats.tov, fga: p.stats.fga, fgm: p.stats.fgm, threePA: p.stats.fg3a, threePM: p.stats.fg3m, fta: p.stats.fta, ftm: p.stats.ftm, pf: p.stats.fouls, minutes: Math.round(p.stats.min / 60), plusMinus: p.stats.plusMinus, number: p.number, name: p.name, shotChart: p.stats.shotChart || [] }; });
        const game = { id: State.match.id.toString(36), date: State.match.date, opponent: State.match.opponent, homeScore: scores.home, awayScore: scores.away, phase: State.match.phase, playerStats, opponentStats, opponentPlayerStats, starters: State.starters, actions: State.actions };
        firebaseGames.unshift(game);
        db.collection('team_data').doc('games').set({ list: firebaseGames }).then(() => { UI.toast('✅ Sauvegardé !'); this.clearMatchInProgress(); });
    },

const Court = {
    cvs: null, ctx: null, scale: 1, offset: { x: 0, y: 0 },
    init() {
        this.cvs = document.getElementById('courtCanvas');
        this.ctx = this.cvs.getContext('2d');
        window.addEventListener('resize', () => this.resize());
        const handler = (e) => {
            e.preventDefault();
            const r = this.cvs.getBoundingClientRect();
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            const x = (cx - r.left) * (this.cvs.width / r.width);
            const y = (cy - r.top) * (this.cvs.height / r.height);
            const mx = (x - this.offset.x) / this.scale;
            const my = (y - this.offset.y) / this.scale;
            if (mx < 0 || mx > 28 || my < 0 || my > 15) return;
            const d1 = Math.sqrt(Math.pow(mx - 1.575, 2) + Math.pow(my - 7.5, 2));
            const d2 = Math.sqrt(Math.pow(mx - 26.425, 2) + Math.pow(my - 7.5, 2));
            const val = Math.min(d1, d2) > 6.75 ? 3 : 2;
            GameEngine.handleCourtClick(mx, my, val);
        };
        this.cvs.addEventListener('mousedown', handler);
        this.cvs.addEventListener('touchstart', handler);
        this.resize();
    },
    resize() { const p = this.cvs.parentElement; if (!p) return; this.cvs.width = p.clientWidth * 2; this.cvs.height = p.clientHeight * 2; const sW = this.cvs.width / 28, sH = this.cvs.height / 15; this.scale = Math.min(sW, sH) * 0.95; this.offset = { x: (this.cvs.width - 28 * this.scale) / 2, y: (this.cvs.height - 15 * this.scale) / 2 }; this.draw(); },
    // Feature 7: Filter
    setFilter(type, value) { State.ui.courtFilter[type] = value === 'all' ? 'all' : (type === 'quarter' ? parseInt(value) : value); this.draw(); },
    getFilteredShots() {
        return State.actions.filter(a => {
            if (a.type !== 'SHOT' || a.x == null) return false;
            const f = State.ui.courtFilter;
            const p = State.players[a.pid];
            if (f.team !== 'all' && p?.team !== f.team) return false;
            if (f.quarter !== 'all' && a.q !== f.quarter) return false;
            return true;
        });
    },
    draw() {
        const ctx = this.ctx, s = this.scale, ox = this.offset.x, oy = this.offset.y;
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, this.cvs.width, this.cvs.height);
        ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, 28 * s, 15 * s); ctx.clip();
        ctx.fillStyle = '#c9a66b'; ctx.fillRect(ox, oy, 28 * s, 15 * s);
        ctx.strokeStyle = 'rgba(0,0,0,0.08)'; for (let i = 0; i < 30; i++) { ctx.beginPath(); ctx.moveTo(ox, oy + i * s * 0.5); ctx.lineTo(ox + 28 * s, oy + i * s * 0.5); ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(2, 0.05 * s);
        ctx.strokeRect(ox, oy, 28 * s, 15 * s);
        ctx.beginPath(); ctx.moveTo(ox + 14 * s, oy); ctx.lineTo(ox + 14 * s, oy + 15 * s); ctx.stroke();
        ctx.beginPath(); ctx.arc(ox + 14 * s, oy + 7.5 * s, 1.8 * s, 0, Math.PI * 2); ctx.stroke();
        this.drawHalf(ctx, s, ox, oy, true); this.drawHalf(ctx, s, ox, oy, false);
        this.drawShots(ctx, s, ox, oy);
    },
    drawHalf(ctx, s, ox, oy, left) {
        const bx = left ? 1.575 : 26.425; const px = left ? 0 : 28 - 5.8; const pe = left ? 5.8 : 28 - 5.8;
        ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(2, 0.05 * s);
        ctx.strokeRect(ox + px * s, oy + 5.05 * s, 5.8 * s, 4.9 * s);
        ctx.beginPath(); if (left) ctx.arc(ox + pe * s, oy + 7.5 * s, 1.8 * s, -Math.PI / 2, Math.PI / 2); else ctx.arc(ox + pe * s, oy + 7.5 * s, 1.8 * s, Math.PI / 2, -Math.PI / 2); ctx.stroke();
        const r = 6.75, cy = 0.9, dy = 7.5 - cy, dx = Math.sqrt(r * r - dy * dy);
        ctx.beginPath();
        if (left) { ctx.moveTo(ox, oy + cy * s); ctx.lineTo(ox + (bx + dx) * s, oy + cy * s); ctx.arc(ox + bx * s, oy + 7.5 * s, r * s, -Math.acos(dx / r), Math.acos(dx / r)); ctx.lineTo(ox, oy + (15 - cy) * s); }
        else { ctx.moveTo(ox + 28 * s, oy + cy * s); ctx.lineTo(ox + (bx - dx) * s, oy + cy * s); ctx.arc(ox + bx * s, oy + 7.5 * s, r * s, Math.PI + Math.acos(dx / r), Math.PI - Math.acos(dx / r), true); ctx.lineTo(ox + 28 * s, oy + (15 - cy) * s); }
        ctx.stroke();
        ctx.strokeStyle = '#ea580c'; ctx.lineWidth = Math.max(2, 0.04 * s);
        ctx.beginPath(); ctx.arc(ox + bx * s, oy + 7.5 * s, 0.225 * s, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = 'white'; ctx.lineWidth = Math.max(1, 0.03 * s);
        const boardX = left ? 1.2 : 26.8;
        ctx.beginPath(); ctx.moveTo(ox + boardX * s, oy + 6.4 * s); ctx.lineTo(ox + boardX * s, oy + 8.6 * s); ctx.stroke();
    },
    drawShots(ctx, s, ox, oy) {
        this.getFilteredShots().forEach(a => {
            const cx = ox + a.x * s, cy = oy + a.y * s;
            ctx.beginPath(); ctx.arc(cx, cy, 0.4 * s, 0, Math.PI * 2);
            ctx.fillStyle = a.made ? '#22c55e' : '#ef4444'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = `bold ${0.35 * s}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(a.val, cx, cy);
        });
    },
    showMsg(txt) { const el = document.getElementById('overlayMsg'); el.textContent = txt; el.classList.add('show'); },
    hideMsg() { document.getElementById('overlayMsg').classList.remove('show'); }
};

window.onload = initFirebase;
window.addEventListener('beforeunload', () => { if (State.match.id && State.actions.length > 0) GameEngine.saveMatchInProgress(); });
</script>
